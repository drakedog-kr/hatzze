name: IndexNow 알림

# 자료가 새로 들어간 뒤 "이 주소들 내용이 바뀌었다"를 검색엔진에 알린다.
#
# ## 왜 IndexNow 인가
#
# IndexNow 는 **바뀐 주소**를 알리는 규약이다. 화면 여남은 개의 내용이 매일 바뀌고, 종목 실주소
# (/stock · /insider/stock)가 매일 새 집계를 받는다. 새 글(데일리 노트 /daily/날짜)도 있는데, 그건
# 올리는 스크립트(publish_daily_note.py)가 올린 직후 그 한 편을 따로 알린다 — 손으로 올리는 글이라
# 이 워크플로(파이프라인 뒤에 돈다)로는 닿지 않는다.
#
# 빙이 만든 규약이고 네이버가 2023-07 부터 지원한다. 한 번 붙이면 둘이 같이 커버된다.
# ⛔ **구글은 IndexNow 를 안 쓴다.** 구글 쪽은 사이트맵과 크롤링이 전부다.
#
# ## 언제 도나
#
# 파이프라인(Daily Indicator Update)이 끝나면 자동으로 뒤따른다. 그 워크플로 파일은
# 1,300줄이 넘고 게이트가 촘촘해서 **거기에 스텝을 끼워 넣지 않는다** — 알림 하나 때문에
# 파이프라인이 흔들리면 손해가 훨씬 크다. 실패한 실행이어도 앞쪽 집계는 대개 들어가 있고
# 알림 자체는 부작용이 없어 결과와 무관하게 따라 돈다.
#
# ⛔ 단, **게이트(guard)가 막은 실행 뒤에는 알리지 않는다.** Vercel 크론이 같은 슬롯을 두 번 던지면
#    guard 가 둘째를 막는데, 그 실행도 success 로 끝나 예전엔 같은 주소를 한 번 더 알렸다(2026-09-30 점검).
#    막힌 실행은 finalize 잡이 skipped 다 — 그걸 보고 멈춘다.
#
# ## 주소 목록
#
# robots.txt 가 가리키는 사이트맵을 전부 읽고, **최근에 바뀐 주소만** 고른다(scripts/indexnow-urls.mjs 머리말).
# 목록을 여기 또 적으면 두 곳이 어긋난다. 예전엔 /sitemap.xml 하나만 읽어 종목·노트가 빠졌고,
# 약관·업데이트 기록 같은 안 바뀐 주소를 하루 두 번씩 보냈다.
on:
  workflow_run:
    workflows: ["Daily Indicator Update"]
    types: [completed]
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    # 사이트맵 몇 장과 POST 두 번이다. 멈춘 요청이 러너를 여섯 시간 잡지 않게 끊는다.
    timeout-minutes: 10
    permissions:
      contents: read
      # 따라 도는 실행의 잡 결과를 읽는다(아래 guard 확인).
      actions: read
    steps:
      - name: 게이트가 막은 실행인지 본다
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          # 손으로 돌린 것(workflow_dispatch)은 따라 도는 실행이 없다 — 그냥 알린다.
          if [ -z "${RUN_ID:-}" ]; then echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          # finalize 는 guard 가 막지 않은 실행이면 앞 잡이 실패해도 돈다(daily-update.yml 의 always()).
          # 그래서 skipped 면 곧 guard 가 막은 실행이다. 조회가 실패하면 알리는 쪽으로 둔다(부작용이 없다).
          c=$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID/jobs?per_page=100" \
                --jq '.jobs[] | select(.name == "finalize") | .conclusion' 2>/dev/null || echo "")
          echo "finalize: ${c:-모름}"
          if [ "$c" = "skipped" ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; else echo "skip=false" >> "$GITHUB_OUTPUT"; fi

      - name: Checkout
        if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@v5
        with:
          sparse-checkout: scripts

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.skip != 'true'
        with:
          node-version: "22"

      - name: 최근에 바뀐 주소를 IndexNow 로 알린다
        if: steps.gate.outputs.skip != 'true'
        env:
          # 키 파일이 public/ 에 그대로 들어 있다. IndexNow 는 **키를 공개하는 것이
          # 전제인 규약**이다 — 그 파일을 띄울 수 있다는 것이 곧 소유 증명이다.
          # ⚠️ data-pipeline/scripts/publish_daily_note.py 의 INDEXNOW_KEY 와 같은 값이다.
          KEY: ab6f7eb990b731962fa46e5b6693c232
          HOST: hatzze.fun
        run: |
          set -euo pipefail
          # 고르는 규칙과 까닭은 스크립트 머리말에 있다. 고른 게 없으면 1 로 끝나 여기서 멈춘다.
          urls=$(node scripts/indexnow-urls.mjs "$HOST")
          echo "$urls" | sed 's/^/  /'
          body=$(printf '%s\n' "$urls" | jq -R . | jq -sc \
                 --arg h "$HOST" --arg k "$KEY" \
                 '{host:$h, key:$k, keyLocation:("https://"+$h+"/"+$k+".txt"), urlList:.}')
          # 두 곳에 낸다. 규약상 한 곳에 내면 참여 엔진끼리 나눠 갖게 돼 있지만,
          # 네이버는 자기 엔드포인트를 따로 두고 안내하므로 그쪽에도 직접 낸다.
          for ep in https://api.indexnow.org/IndexNow https://searchadvisor.naver.com/indexnow; do
            code=$(curl -sS -o /tmp/out.txt -w '%{http_code}' --max-time 30 \
                   -X POST "$ep" -H 'Content-Type: application/json' -d "$body" || echo 000)
            echo "$ep → $code $(head -c 200 /tmp/out.txt)"
          done
          # 알림이 실패해도 파이프라인 실패로 보지 않는다. 다음 실행이 같은 걸 또 알린다.
          echo "완료"

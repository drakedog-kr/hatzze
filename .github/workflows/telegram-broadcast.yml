on:
  # ⛔ **깃헙 예약을 껐다(2026-08-29).** 시각은 Vercel Cron 이 지킨다 — 수·토·일 14:00 KST
  #    에 `workflow_dispatch` 로 던지고, 요일에 따라 format 을 골라 넘긴다(수·토=theme,
  #    일=weekly). 이유는 daily-update.yml 머리 주석 참고.
  #
  #    ⚠️ 예약이 없으므로 아래 '발송 시각까지 대기' 스텝은 더 이상 돌지 않는다(조건이
  #       `event_name == 'schedule'` 이다). 되돌릴 때를 위해 남겨 둔다.
  workflow_dispatch:
    inputs:
      format:
        description: "보낼 글"
        type: choice
        options: [theme, weekly]
        default: theme
      send:
        description: "실제로 발송한다 (끄면 미리보기만 찍고 안 보낸다)"
        type: boolean
        default: false

jobs:
  # ── 동시 실행 방지 게이트 ──────────────────────────────────────────────────
  #
  # 막는 건 하나다. **같은 순간에 둘이 도는 것.** Vercel 크론은 전달이 best effort 라 같은
  # 예약을 두 번 부를 수 있는데(문서 명시), 두 요청이 1초 안에 겹치면 서로가 만든 실행을
  # 못 보고 둘 다 던진다. 그러면 같은 글이 두 번 나간다. 게이트는 실행이 **생긴 뒤** 도므로
  # 그 경합을 여기서 푼다 — 나보다 먼저 생겼고 아직 도는 실행이 있으면 늦은 쪽만 빠진다.
  #
  # ⚠️ **아직 도는 실행만 센다.** 끝난 실행은 안 센다(손으로 다시 보내는 길을 막으면 안 된다).
  # ⚠️ **예약은 14:05 전에 생긴 것만 센다.** 그 뒤에 도착한 예약은 발송 창 밖이라 어차피
  #    아무것도 못 보낸다. 그런 실행을 '도는 중'으로 세면 폴백이 물러나 그날 발송이 통째로
  #    빈다. 수동 실행(폴백 포함)은 창과 무관하므로 시각을 안 본다.
  #    이 14:05 는 아래 '발송 요일 판정'의 창, lib/cron-schedule.ts 의 untilUtc 와 같은 선이다.
  #
  # ⚠️ 게이트가 고장 나면 **열려야 한다**. 조회가 실패하면 skip 은 false 로 남고, 아래
  #    조건도 `!cancelled()` 라 이 잡이 죽어도 발송은 그대로 돈다.
  guard:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      skip: ${{ steps.decide.outputs.skip }}
    steps:
      - name: 지금 도는 실행이 있나
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          skip=false
          mine=$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq ".created_at" 2>/dev/null || true)
          if [ -z "$mine" ]; then
            echo "내 실행 생성 시각을 못 읽어 게이트를 엽니다 — 그대로 진행합니다"
          else
            # 오늘(KST) 14:05 = 05:05Z. 날짜는 내 생성 시각에서 뽑는다.
            until="$(date -u -d "$mine" +%Y-%m-%d)T05:05:00Z"
            q=".workflow_runs[]"
            q="$q | select(.status != \"completed\")"
            q="$q | select(.event == \"workflow_dispatch\" or .created_at < \"$until\")"
            q="$q | select(.created_at < \"$mine\" or (.created_at == \"$mine\" and .id < $GITHUB_RUN_ID))"
            q="$q | .html_url"
            busy=$(gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/telegram-broadcast.yml/runs?per_page=20&branch=main" --jq "$q" 2>/dev/null | head -1 || true)
            if [ -n "$busy" ]; then
              skip=true
              echo "이미 도는 실행이 있어 건너뜁니다: $busy"
              echo "## 실행을 건너뜀 — 이미 도는 실행이 있음" >> "$GITHUB_STEP_SUMMARY"
              echo "$busy 가 아직 돌고 있어 이 실행은 아무것도 하지 않습니다." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "도는 실행이 없습니다 — 그대로 진행합니다"
            fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

  broadcast:
    needs: guard
    if: ${{ !cancelled() && needs.guard.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    # 실패 시 알림 이슈를 열 수 있도록(daily-update.yml 과 같은 감지 레이어).
    permissions:
      contents: read
      issues: write
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      # 해설 문단 생성용. 없으면 문단만 빠지고 숫자·목록은 그대로 나간다(fail-soft).
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # 발송 전용 봇 토큰(수집용 TELEGRAM_SESSION 과 별개).
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_BROADCAST_CHAT_ID: ${{ secrets.TELEGRAM_BROADCAST_CHAT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r data-pipeline/requirements.txt

      # 설치까지 끝내 놓고 기다린다 — 2시가 되면 바로 보내야 하므로, 대기 뒤에 몇 분짜리
      # 설치가 남아 있으면 그만큼 늦게 나간다(kiwipiepy 모델이 88MB 라 설치가 짧지 않다).
      - name: 발송 시각까지 대기 (KST 14:00)
        if: github.event_name == 'schedule'
        run: |
          target=$(TZ=Asia/Seoul date -d 'today 14:00' +%s)
          now=$(date +%s)
          wait=$(( target - now ))
          echo "지금 $(TZ=Asia/Seoul date '+%F(%a) %H:%M') KST · 목표 14:00"
          if [ "$wait" -le 0 ]; then
            # 큐가 예상보다 크게 밀린 경우. 기다릴 게 없으니 바로 보낸다.
            echo "이미 14:00 을 지났습니다($(( -wait / 60 ))분). 대기 없이 진행합니다."
          else
            # 상한을 둔다. 큐 지연이 없다시피 한 날은 11:20 에 시작해 2시간 40분을
            # 기다리게 되는데, 그보다 더 긴 대기는 발화 시각이 잘못됐다는 뜻이다.
            [ "$wait" -gt 10800 ] && wait=10800
            echo "$(( wait / 60 ))분 대기합니다."
            sleep "$wait"
          fi
          echo "발송 시각 $(TZ=Asia/Seoul date '+%F(%a) %H:%M') KST"

      - name: 발송 요일 판정
        id: when
        run: |
          DOW=$(TZ=Asia/Seoul date +%u)   # 1=월 … 7=일
          themeday=false; sunday=false
          # 관심 이동(테마)은 3일 간격이다. 카더라 집계 창이 3일이라 그 주기로 보내면
          # 매번 완전히 새 구간을 말한다. 수·토로 고정한 건 (a) 수→토 3일 · 토→수 4일로
          # 3일에 가장 가까우면서 (b) 요일이 고정돼 구독자가 리듬을 익히기 때문이다.
          # 날짜 나머지(%3)로 돌리면 요일이 매주 바뀐다.
          # 토요일이 끼는 건 의도된 것이다(2026-08-01 에 화·금에서 옮겼다). 시장이 닫혀도
          # 이 글의 재료는 카더라 채널 메시지라 주말에도 새 이야기가 쌓인다 — 시장 숫자를
          # 되풀이하는 A·B 를 주말에 안 보내는 것과는 사정이 다르다. 자료 게이트도 통과한다:
          # check_freshness 의 허용치가 **영업일** 기준이라 주말은 나이를 먹지 않고, 애초에
          # D 가 일요일에 같은 게이트를 지나 나가고 있다.
          { [ "$DOW" -eq 3 ] || [ "$DOW" -eq 6 ]; } && themeday=true
          [ "$DOW" -eq 7 ] && sunday=true
          echo "themeday=$themeday" >> "$GITHUB_OUTPUT"
          echo "sunday=$sunday" >> "$GITHUB_OUTPUT"
          echo "DOW=$DOW · 테마일=$themeday 일요일=$sunday"

      # 낡은 값 차단. 이 워크플로엔 수집·계산 스텝이 없어서 daily-update.yml 처럼
      # 앞 스텝 결과를 볼 수가 없다. 대신 같은 검사를 직접 돌려 게이트로 쓴다 — DB 조회만
      # 하는 가벼운 스크립트다. 발송 스크립트 안에도 게이트가 하나 더 있다(daily_score 나이).
      - name: 자료 정체 감시 (발송 게이트)
        id: check_freshness
        continue-on-error: true
        run: python data-pipeline/scripts/check_freshness.py

      - name: (텔레그램) C 관심 이동 발송 (수·토 14:00)
        id: telegram_theme
        continue-on-error: true
        if: >-
          steps.check_freshness.outcome == 'success'
          && github.run_attempt == '1'
          && (
            (github.event_name == 'schedule' && steps.when.outputs.themeday == 'true')
            || (github.event.inputs.send == 'true' && github.event.inputs.format == 'theme')
          )
        run: python data-pipeline/scripts/send_telegram_broadcast.py --send --format theme

      - name: (텔레그램) D 주간 결산 발송 (일요일 14:00)
        id: telegram_weekly
        continue-on-error: true
        if: >-
          steps.check_freshness.outcome == 'success'
          && github.run_attempt == '1'
          && (
            (github.event_name == 'schedule' && steps.when.outputs.sunday == 'true')
            || (github.event.inputs.send == 'true' && github.event.inputs.format == 'weekly')
          )
        run: python data-pipeline/scripts/send_telegram_broadcast.py --send --format weekly

      # 수동 실행에서 send 를 껐을 때의 미리보기. 실제로는 안 보낸다.
      - name: 미리보기 (수동 실행 · 발송 끔)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.send != 'true'
        run: python data-pipeline/scripts/send_telegram_broadcast.py --format ${{ github.event.inputs.format }}

      - name: Summarize results
        if: always()
        run: |
          names=("check_freshness.py" "broadcast(C테마)" "broadcast(D주간)")
          outcomes=("${{ steps.check_freshness.outcome }}" "${{ steps.telegram_theme.outcome }}" "${{ steps.telegram_weekly.outcome }}")

          {
            echo "## Telegram broadcast summary"
            echo "| Step | Result |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          failed=0
          failed_list=""
          for i in "${!names[@]}"; do
            name="${names[$i]}"
            outcome="${outcomes[$i]}"
            echo "$name: $outcome"
            case "$outcome" in
              success)
                echo "| $name | success |" >> "$GITHUB_STEP_SUMMARY"
                ;;
              skipped|"")
                # 'skipped'는 실패가 아니다. 수·토엔 D 가, 일요일엔 C 가 **일부러**
                # 건너뛴다. 이걸 실패로 세면 발송이 있는 날마다 알림 이슈가 열린다.
                echo "| $name | skipped (예정된 건너뜀) |" >> "$GITHUB_STEP_SUMMARY"
                ;;
              *)
                echo "| $name | $outcome |" >> "$GITHUB_STEP_SUMMARY"
                failed=1
                failed_list="${failed_list:+$failed_list, }$name"
                ;;
            esac
          done

          if [ "$failed" = "1" ]; then
            echo "FAILED_STEPS=$failed_list" >> "$GITHUB_ENV"
            echo "One or more steps failed. Check the step logs above."
            exit 1
          fi

      - name: Alert on failure (open/update GitHub issue)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          failed="${FAILED_STEPS:-요약 탭에서 확인}"
          title="⚠️ 텔레그램 오후 발송 실패"
          note=$(printf '오후 2시 채널 발송이 실패했습니다.\n\n- 시각(UTC): %s\n- 실패 스텝: %s\n- 로그/요약: %s\n\n자료가 정체됐으면(check_freshness) 다음 파이프라인 실행이 회복시킵니다. 계속 실패하면 확인이 필요합니다.' \
            "$(date -u '+%Y-%m-%d %H:%M')" "$failed" "$run_url")
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$note"
            echo "기존 알림 이슈 #$existing 에 코멘트 추가"
          else
            gh issue create --title "$title" --body "$note"
            echo "새 알림 이슈 생성"
          fi

name: Telegram Broadcast (수 12:30 · 토 10:30 · 일 21:00)

# 요일마다 정해진 시각(KST)에 나가는 세 글 — 주중 점검(수 12:30) · 이번 주 미장 흐름(토 10:30) · 한 주 정리와 다음 주 일정(일 21:00).
# 시각의 근거(GA4 요일×시간 실측)는 lib/cron-schedule.ts 에 있다.
#
# 2026-09-10 부터 2판(common/broadcast_digest.py)이다. 1판의 C 관심 이동(theme)·D 주간 결산(weekly)은
# 스크립트에 남아 있지만 여기서는 더 부르지 않는다.
#
# **왜 파이프라인과 분리했나.** daily-update.yml 은 아침(~11:00)과 저녁(~20:20)에 돈다.
# 아침·저녁 글은 그 데이터가 막 갱신된 직후에 나가는 게 맞아 거기 붙였지만,
# 이 셋은 어느 실행 직후도 아니라 붙지 않는다. 파이프라인 크론을 하나 더 늘리면 지표 수집
# 26개가 통째로 한 번 더 도는 셈이라, 발송만 하는 가벼운 워크플로를 따로 뒀다.
#
# 자료는 그날 아침 실행이 이미 채워 뒀다(~08:27 완료 · 일요일 글의 창은 월~금이라 저녁 발송이어도 같다).

on:
  # ⛔ **깃헙 예약을 껐다(2026-08-29).** 시각은 Vercel Cron 이 지킨다 — 수 12:30 · 토 10:30 · 일 21:00 KST
  #    에 `workflow_dispatch` 로 던지고, 요일에 따라 format 을 골라 넘긴다(수=midweek,
  #    토=us_weekend · 일=weekly2 — lib/cron-schedule.ts broadcastFormat). 이유는 daily-update.yml 머리 주석 참고.
  #
  #    ⚠️ 예약이 없으므로 아래 '발송 시각까지 대기' 스텝은 더 이상 돌지 않는다(조건이
  #       `event_name == 'schedule'` 이다). 되돌릴 때를 위해 남겨 둔다.
  workflow_dispatch:
    inputs:
      format:
        description: "보낼 글"
        type: choice
        options: [midweek, us_weekend, weekly2]
        default: midweek
      send:
        description: "실제로 발송한다 (끄면 미리보기만 찍고 안 보낸다)"
        type: boolean
        default: false

jobs:
  # ── 동시 실행 방지 게이트 ──────────────────────────────────────────────────
  #
  # 막는 건 하나다. **같은 순간에 둘이 도는 것.** Vercel 크론은 전달이 best effort 라 같은
  # 예약을 두 번 부를 수 있는데(문서 명시), 두 요청이 1초 안에 겹치면 서로가 만든 실행을
  # 못 보고 둘 다 던진다. 그러면 같은 글이 두 번 나간다. 게이트는 실행이 **생긴 뒤** 도므로
  # 그 경합을 여기서 푼다 — 나보다 먼저 생겼고 아직 도는 실행이 있으면 늦은 쪽만 빠진다.
  #
  # ⚠️ **아직 도는 실행만 센다.** 끝난 실행은 안 센다(손으로 다시 보내는 길을 막으면 안 된다).
  # ⚠️ **예약은 14:05 전에 생긴 것만 센다**(꺼 둔 깃헙 예약 경로에만 해당). 그 뒤에 도착한 예약은 발송 창 밖이라 어차피
  #    아무것도 못 보낸다. 그런 실행을 '도는 중'으로 세면 폴백이 물러나 그날 발송이 통째로
  #    빈다. 수동 실행(폴백 포함)은 창과 무관하므로 시각을 안 본다.
  #    이 14:05 는 아래 '발송 요일 판정'의 창, lib/cron-schedule.ts 의 untilUtc 와 같은 선이다.
  #
  # ⚠️ 게이트가 고장 나면 **열려야 한다**. 조회가 실패하면 skip 은 false 로 남고, 아래
  #    조건도 `!cancelled()` 라 이 잡이 죽어도 발송은 그대로 돈다.
  guard:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      skip: ${{ steps.decide.outputs.skip }}
    steps:
      - name: 지금 도는 실행이 있나
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          skip=false
          mine=$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq ".created_at" 2>/dev/null || true)
          if [ -z "$mine" ]; then
            echo "내 실행 생성 시각을 못 읽어 게이트를 엽니다 — 그대로 진행합니다"
          else
            # 오늘(KST) 14:05 = 05:05Z. 날짜는 내 생성 시각에서 뽑는다.
            until="$(date -u -d "$mine" +%Y-%m-%d)T05:05:00Z"
            q=".workflow_runs[]"
            q="$q | select(.status != \"completed\")"
            q="$q | select(.event == \"workflow_dispatch\" or .created_at < \"$until\")"
            q="$q | select(.created_at < \"$mine\" or (.created_at == \"$mine\" and .id < $GITHUB_RUN_ID))"
            q="$q | .html_url"
            busy=$(gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/telegram-broadcast.yml/runs?per_page=20&branch=main" --jq "$q" 2>/dev/null | head -1 || true)
            if [ -n "$busy" ]; then
              skip=true
              echo "이미 도는 실행이 있어 건너뜁니다: $busy"
              echo "## 실행을 건너뜀 — 이미 도는 실행이 있음" >> "$GITHUB_STEP_SUMMARY"
              echo "$busy 가 아직 돌고 있어 이 실행은 아무것도 하지 않습니다." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "도는 실행이 없습니다 — 그대로 진행합니다"
            fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

  broadcast:
    needs: guard
    if: ${{ !cancelled() && needs.guard.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    # 실패 시 알림 이슈를 열 수 있도록(daily-update.yml 과 같은 감지 레이어).
    permissions:
      contents: read
      issues: write
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      # 해설 문단 생성용. 없으면 문단만 빠지고 숫자·목록은 그대로 나간다(fail-soft).
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # 해설 문단을 Max 구독으로 먼저 보낸다(common/llm_client.py). daily-update.yml 과 같다.
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      # 발송 전용 봇 토큰(수집용 TELEGRAM_SESSION 과 별개).
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_BROADCAST_CHAT_ID: ${{ secrets.TELEGRAM_BROADCAST_CHAT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r data-pipeline/requirements.txt

      # 구독 경로는 `claude` CLI 를 자식 프로세스로 부른다. 러너엔 없으니 받아 둔다.
      # 실패해도 발송을 세우지 않는다 — 래퍼가 API 키로 되돌아간다.
      - name: Install Claude Code CLI (LLM 구독 경로)
        continue-on-error: true
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/claude" --version

      # 설치까지 끝내 놓고 기다린다 — 시각이 되면 바로 보내야 하므로, 대기 뒤에 몇 분짜리
      # 설치가 남아 있으면 그만큼 늦게 나간다(kiwipiepy 모델이 88MB 라 설치가 짧지 않다).
      - name: 발송 시각까지 대기 (요일별 시각)
        if: github.event_name == 'schedule'
        run: |
          # 수 12:30 · 토 10:30 · 일 21:00 (KST). vercel.json·lib/cron-schedule.ts 와 같은 값.
          case "$(TZ=Asia/Seoul date +%u)" in 6) at="10:30" ;; 7) at="21:00" ;; *) at="12:30" ;; esac
          target=$(TZ=Asia/Seoul date -d "today $at" +%s)
          now=$(date +%s)
          wait=$(( target - now ))
          echo "지금 $(TZ=Asia/Seoul date '+%F(%a) %H:%M') KST · 목표 $at"
          if [ "$wait" -le 0 ]; then
            # 큐가 예상보다 크게 밀린 경우. 기다릴 게 없으니 바로 보낸다.
            echo "이미 $at 을 지났습니다($(( -wait / 60 ))분). 대기 없이 진행합니다."
          else
            # 상한을 둔다. 큐 지연이 없다시피 한 날은 11:20 에 시작해 2시간 40분을
            # 기다리게 되는데, 그보다 더 긴 대기는 발화 시각이 잘못됐다는 뜻이다.
            [ "$wait" -gt 10800 ] && wait=10800
            echo "$(( wait / 60 ))분 대기합니다."
            sleep "$wait"
          fi
          echo "발송 시각 $(TZ=Asia/Seoul date '+%F(%a) %H:%M') KST"

      - name: 발송 요일 판정
        id: when
        run: |
          DOW=$(TZ=Asia/Seoul date +%u)   # 1=월 … 7=일
          wednesday=false; saturday=false; sunday=false
          # 관심 이동(테마)은 3일 간격이다. 카더라 집계 창이 3일이라 그 주기로 보내면
          # 매번 완전히 새 구간을 말한다. 수·토로 고정한 건 (a) 수→토 3일 · 토→수 4일로
          # 3일에 가장 가까우면서 (b) 요일이 고정돼 구독자가 리듬을 익히기 때문이다.
          # 날짜 나머지(%3)로 돌리면 요일이 매주 바뀐다.
          # 토요일이 끼는 건 의도된 것이다(2026-08-01 에 화·금에서 옮겼다). 시장이 닫혀도
          # 이 글의 재료는 카더라 채널 메시지라 주말에도 새 이야기가 쌓인다 — 시장 숫자를
          # 되풀이하는 A·B 를 주말에 안 보내는 것과는 사정이 다르다. 자료 게이트도 통과한다:
          # check_freshness 의 허용치가 **영업일** 기준이라 주말은 나이를 먹지 않고, 애초에
          # D 가 일요일에 같은 게이트를 지나 나가고 있다.
          [ "$DOW" -eq 3 ] && wednesday=true
          [ "$DOW" -eq 6 ] && saturday=true
          [ "$DOW" -eq 7 ] && sunday=true
          echo "wednesday=$wednesday" >> "$GITHUB_OUTPUT"
          echo "saturday=$saturday" >> "$GITHUB_OUTPUT"
          echo "sunday=$sunday" >> "$GITHUB_OUTPUT"
          echo "DOW=$DOW · 수요일=$wednesday 토요일=$saturday 일요일=$sunday"

      # 낡은 값 차단. 이 워크플로엔 수집·계산 스텝이 없어서 daily-update.yml 처럼
      # 앞 스텝 결과를 볼 수가 없다. 대신 같은 검사를 직접 돌려 게이트로 쓴다 — DB 조회만
      # 하는 가벼운 스크립트다. 발송 스크립트 안에도 게이트가 하나 더 있다(daily_score 나이).
      - name: 자료 정체 감시 (발송 게이트)
        id: check_freshness
        continue-on-error: true
        run: python data-pipeline/scripts/check_freshness.py

      - name: (텔레그램) 주중 점검 발송 (수요일 12:30)
        id: telegram_midweek
        continue-on-error: true
        if: >-
          steps.check_freshness.outcome == 'success'
          && github.run_attempt == '1'
          && (
            (github.event_name == 'schedule' && steps.when.outputs.wednesday == 'true')
            || (github.event.inputs.send == 'true' && github.event.inputs.format == 'midweek')
          )
        run: python data-pipeline/scripts/send_telegram_broadcast.py --send --format midweek

      # ── 토요일 글이 쓸 미장 까닭을 여기서 만든다 ──────────────────────────
      #
      # ⚠️ **이 스텝이 없으면 토요일 글에서 '종목별 까닭' 재료가 통째로 빠진다.**
      #    `telegram_us_stock_move_reason` 의 토요일 행은 파이프라인 **저녁 실행(18:00)** 에서
      #    만들어지는데 이 글은 10:30 에 나간다. 실측(2026-09-05): 그 토요일 행 17개가 전부
      #    18시 이후에 생겼다. 그래서 발송 직전에 미장 몫만 따로 만든다.
      #
      # ⚠️ 생성기의 문턱(MIN_DAY_MSGS=1500)도 낮춰야 한다 — 토요일 아침 수집까지 메시지가
      #    762~1,145건이라(2026-08-29·09-05 실측) 그대로면 스스로 건너뛴다. 얇은 표본이라서가
      #    아니라 **토요일이 원래 조용해서**이고, 금요일 미국장은 05:00 KST 에 이미 끝나 있어
      #    이 건수가 그 세션 재료의 전부다.
      #
      # ⛔ 국장 몫(`--us-only` 로 제외)은 건드리지 않는다. 토요일엔 국장이 닫혀 있고,
      #    그 표는 저녁 실행이 자기 규칙대로 채운다.
      # ⛔ 조건에 `send == 'true'` 를 넣어 **미리보기 실행에서는 안 돈다** — 미리보기가 표를
      #    쓰고 LLM 을 부르면 그건 미리보기가 아니다(발송 스텝들과 같은 어법).
      # ⚠️ 18:00 실행이 같은 날짜를 더 많은 메시지로 다시 만들어 덮는다(upsert + 낡은 행 삭제).
      #    여기 결과는 10:30 글이 쓰고, 화면은 저녁 판을 쓴다.
      - name: (텔레그램) 미장 까닭 생성 (토요일 발송용)
        id: us_move_reasons
        continue-on-error: true
        if: >-
          github.run_attempt == '1'
          && (
            (github.event_name == 'schedule' && steps.when.outputs.saturday == 'true')
            || (github.event.inputs.send == 'true' && github.event.inputs.format == 'us_weekend')
          )
        run: python data-pipeline/scripts/generate_move_reasons.py --us-only --min-msgs 400

      - name: (텔레그램) 이번 주 미장 흐름 발송 (토요일 10:30)
        id: telegram_us_weekend
        continue-on-error: true
        if: >-
          steps.check_freshness.outcome == 'success'
          && github.run_attempt == '1'
          && (
            (github.event_name == 'schedule' && steps.when.outputs.saturday == 'true')
            || (github.event.inputs.send == 'true' && github.event.inputs.format == 'us_weekend')
          )
        run: python data-pipeline/scripts/send_telegram_broadcast.py --send --format us_weekend

      - name: (텔레그램) 한 주 정리와 다음 주 일정 발송 (일요일 21:00)
        id: telegram_weekly
        continue-on-error: true
        if: >-
          steps.check_freshness.outcome == 'success'
          && github.run_attempt == '1'
          && (
            (github.event_name == 'schedule' && steps.when.outputs.sunday == 'true')
            || (github.event.inputs.send == 'true' && github.event.inputs.format == 'weekly2')
          )
        run: python data-pipeline/scripts/send_telegram_broadcast.py --send --format weekly2

      # 수동 실행에서 send 를 껐을 때의 미리보기. 실제로는 안 보낸다.
      - name: 미리보기 (수동 실행 · 발송 끔)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.send != 'true'
        run: python data-pipeline/scripts/send_telegram_broadcast.py --format ${{ github.event.inputs.format }}

      - name: Summarize results
        if: always()
        run: |
          names=("check_freshness.py" "generate_move_reasons.py(미장)" "broadcast(주중 점검)" "broadcast(미장 흐름)" "broadcast(한 주 정리)")
          outcomes=("${{ steps.check_freshness.outcome }}" "${{ steps.us_move_reasons.outcome }}" "${{ steps.telegram_midweek.outcome }}" "${{ steps.telegram_us_weekend.outcome }}" "${{ steps.telegram_weekly.outcome }}")

          {
            echo "## Telegram broadcast summary"
            echo "| Step | Result |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          failed=0
          failed_list=""
          for i in "${!names[@]}"; do
            name="${names[$i]}"
            outcome="${outcomes[$i]}"
            echo "$name: $outcome"
            case "$outcome" in
              success)
                echo "| $name | success |" >> "$GITHUB_STEP_SUMMARY"
                ;;
              skipped|"")
                # 'skipped'는 실패가 아니다. 세 스텝 중 그날 요일 것 하나만 돌고 나머지 둘은 **일부러**
                # 건너뛴다. 이걸 실패로 세면 발송이 있는 날마다 알림 이슈가 열린다.
                echo "| $name | skipped (예정된 건너뜀) |" >> "$GITHUB_STEP_SUMMARY"
                ;;
              *)
                echo "| $name | $outcome |" >> "$GITHUB_STEP_SUMMARY"
                failed=1
                failed_list="${failed_list:+$failed_list, }$name"
                ;;
            esac
          done

          if [ "$failed" = "1" ]; then
            echo "FAILED_STEPS=$failed_list" >> "$GITHUB_ENV"
            echo "One or more steps failed. Check the step logs above."
            exit 1
          fi

      - name: Alert on failure (open/update GitHub issue)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          failed="${FAILED_STEPS:-요약 탭에서 확인}"
          title="⚠️ 텔레그램 오후 발송 실패"
          note=$(printf '오후 2시 채널 발송이 실패했습니다.\n\n- 시각(UTC): %s\n- 실패 스텝: %s\n- 로그/요약: %s\n\n자료가 정체됐으면(check_freshness) 다음 파이프라인 실행이 회복시킵니다. 계속 실패하면 확인이 필요합니다.' \
            "$(date -u '+%Y-%m-%d %H:%M')" "$failed" "$run_url")
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$note"
            echo "기존 알림 이슈 #$existing 에 코멘트 추가"
          else
            number=$(gh issue create --title "$title" --body "$note" | sed 's#.*/##')
            echo "새 알림 이슈 #$number 생성"
          fi
          # 담당자를 붙인다. 저장소 watch 설정과 무관하게 '나에게 할당됨'으로 뜨고 알림이
          # 간다 — 여기 이슈는 봇이 열고 라벨도 멘션도 없어서, 안 붙이면 닿는지 여부가
          # 전적으로 그 설정에 달린다.
          # ⚠️ 실패해도 이슈는 남긴다. 알림 통로를 넓히려다 이슈 자체를 잃으면 본말이 뒤집힌다.
          gh issue edit "${number:-$existing}" --add-assignee "${{ github.repository_owner }}" >/dev/null \
            || echo "담당자 지정에 실패했습니다 — 이슈는 열려 있습니다"

name: Daily Indicator Update

on:
  schedule:
    # ⚠️ 발화 시각 ≠ 실제 실행 시각. GitHub 예약 큐가 실행을 밀어낸다 —
    # **2026-08-13 실측 61~68분**(예전엔 90~150분이었다. 이 값은 깃헙 사정으로 변한다).
    # (완료 시각 표기는 lib/format.ts SCHEDULED_HOURS_KST 와 연동.)
    #
    # ⭐ **지연에 기대는 설계를 그만뒀다(2026-08-14).** 예전엔 "붐비는 슬롯의 큰 지연이
    # 실행을 KRX 공표 뒤로 밀어 준다"는 계산으로 발화를 잡았는데, 지연이 100분에서 60분대로
    # 줄자 그 계산이 통째로 어긋났다(실행이 10:45 예정 → 실제 10:00). 저녁도 같이 밀려
    # 디시 표본 시간대가 1시간 반 이동해 있었다. 지금은 **발화를 이르게 잡고 잡 안에서
    # 대기 게이트로 못 박는다**(아래 'KRX 공표(08:00 KST) 대기' 스텝). 지연이 얼마든
    # 게이트를 지나는 시각은 같다.
    #
    # ── 아침 ── 발화 21:30 UTC(06:30 KST) → 지연 14~24분 → 실제 실행 06:44~06:53 →
    # 카더라 블록 ~60분 → 지표 블록(08:00 게이트 뒤) → 완료 08:06~08:34 → A 브리핑 5분 뒤.
    # (한 실행의 총 소요는 실측 80~105분이다 — 그날 메시지량과 LLM 배치에 따라 흔들린다.)
    # ⚠️ 위 시각은 **2026-08-28 실측**이다(정상 12건, 08-16~08-26). 지연은 깃헙 사정으로
    #    변하니 인용하기 전에 `gh run list` 로 다시 잴 것. 이 줄이 한 번 낡은 채로 답에
    #    인용됐다(옛 값 '실행 ~07:30 · 완료 ~08:45~09:05'은 실제보다 30분 늦은 값이었다).
    # **카더라를 먼저 돌린다** — KRX 와 무관해 아무 때나 되고, 그동안 08:00 을 기다린다.
    # 그래서 카더라 면이 지표보다 한 시간쯤 먼저 새로워진다(출근 시간대 반영이 목적).
    #
    # ⚠️ KRX Open API 는 전 영업일 자료를 **08:00 KST 정각**에 올린다(2026-08-14 실측:
    # 07:54:52 엔 7개 서비스 전부 0행, 08:00:00 에 전부 채워짐). 그 전에 지표를 받으면
    # 그제치가 저장돼 지수가 하루 밀린다 — 그래서 게이트가 있다. 발화를 더 당겨도
    # 지표는 08:00 전에 못 돈다.
    #
    # ⚠️ 2026-07-29 에 **지수 종가만** 야후로 옮겼지만(fetch_kospi_high_gap·
    # fetch_kosdaq_ratio), 이 제약은 그대로다 — 거래대금·VKOSPI·풋콜·시가총액·선물
    # 미결제약정·전종목 거래대금은 야후에 없어 여전히 KRX 이고 여전히 T+1 이다.
    # ⭐ **여기 남은 예약은 백업이다(2026-08-29).** 주 시계는 Vercel Cron 으로 옮겼다 —
    #    아침 07:00 · 저녁 18:00 KST 에 `workflow_dispatch` 를 던진다(app/api/cron/pipeline).
    #    본 발화였던 `30 21`·`30 8` 은 그래서 뺐다.
    #
    #    옮긴 이유. 깃헙은 부하가 높으면 예약을 지연시키고, 심하면 그 슬롯을 **버린다**
    #    (공식 문서: "If the load is sufficiently high enough, some queued jobs may be
    #    dropped"). 2026-08-26~28 에 실행이 3시간 27분·10시간 41분씩 늦게 생기다가, 08-28
    #    에는 **네 발화가 모두 실행을 만들지 못해 하루 두 번을 다 손으로 돌렸다.** 실패가
    #    아니라 실행 자체가 안 생겨서 알림도 안 열렸고, 사람이 화면을 보고서야 알았다.
    #    반면 `workflow_dispatch` 는 배치 스케줄러가 아니라 실시간 경로라 생성과 시작이
    #    같은 초다(실측 #157·#159·#162).
    #
    #    ⭐ **그래도 이 백업은 지우지 않는다.** Vercel 도 전달이 best effort 라 거를 수 있다.
    #       서로 다른 회사라 같이 죽을 확률이 낮다. Vercel 이 던진 날에는 아래 guard 잡이
    #       "이 슬롯을 이미 처리했다"며 10초 만에 빼므로 러너를 사실상 안 쓴다.
    #    ⚠️ 발화 시각을 Vercel 발사(07:00·18:00)보다 **뒤에** 둬야 한다. 앞에 두면 백업이
    #       먼저 돌아 주객이 바뀐다.
    - cron: "30 22 * * *" # 아침 백업(발화 07:30 KST → 실행 ~07:50 → 완료 ~09:15)
    # ── 오후 ── 발화 08:30 UTC(17:30 KST) → 지연 24~41분 → 실제 실행 17:53~18:11 →
    # 카더라 블록 ~60분 → 지표 블록 → 완료 19:06~19:53 → B 마감 리포트가 5분 뒤.
    # (2026-08-28 실측 11건. 08-15 이전엔 18:38 시작·20:23 완료였다 — 큐가 빨라진 것이다.)
    # (오후가 아침보다 긴 건 발송 전 sleep 300 과 그날 쌓인 메시지량 때문이다.)
    # 아침 실패 자동 만회 + 그날 종가(야후) 확보 + 미국 야간/오후 데이터 재조회를 겸한다.
    #
    # ⭐ 순서를 뒤집은 덕에 **디시 표본 시간대가 눈금과 다시 맞는다.** 디시 지표는 실행
    # 직전 ~2시간이 표본이고 저장값은 오후 실행분인데, 지연이 줄면서 실행이 20:00 →
    # 18:38 로 당겨져 표본이 16:20~18:40 으로 밀려 있었다(눈금은 17:45~20:00 기준으로
    # 잡혀 있다 — PR #305). 지표를 카더라 뒤로 보내면 디시가 ~19:45 에 돌아 표본이
    # 17:45~19:45 로 돌아온다. **오후 발화를 옮기면 이 정렬이 다시 깨진다.**
    #
    # ⚠️ **이 실행에 시각 하한이 생겼다(2026-07-29). 16:00 KST 보다 앞당기지 말 것.**
    # 지수 종가를 야후에서 받게 되면서, **그날 종가를 담는 실행은 오후 하나뿐**이 됐다
    # (아침 ~10:45 는 정규장 한복판이라 common/yahoo_client.py 가 장중값을 일부러 버린다).
    # 16:00 은 정규장 마감 15:30 에 여유 30분을 더한 값이다 — 야후가 마감 직후 몇 분 동안
    # 낡은 값을 주는 걸 실측했다(2026-07-28 15:16~15:37). 이 실행을 16:00 앞으로 옮기면
    # 그날 종가가 통째로 하루 밀린다.
    # 오후 백업(위 '백업이다' 주석 참고). ⚠️ 이 백업이 실제로 도는 날은 디시 표본이 30분쯤
    # 밀린다(눈금은 17:45~20:00 표본 기준). 그날 값이 조금 낮게 잡히는 건 감수한다 —
    # 아무 값도 없는 것보다 낫다.
    - cron: "30 9 * * *" # 오후 백업(발화 18:30 KST → 실행 ~18:55 → 완료 ~20:20)
  workflow_dispatch:
    # ⚠️ 예전엔 `send_telegram` 불리언 하나였는데 그게 **B 마감 리포트에만** 걸려 있었다.
    #    A 어제 브리핑은 조건이 예약 크론에만 묶여 있어 수동으로는 보낼 방법이 아예 없었고,
    #    체크박스 설명("오늘의 지수를 발송한다")은 둘 다 덮는 것처럼 읽혔다. 2026-08-28
    #    아침에 깃헙 예약이 안 들어 손으로 돌려야 했는데, 그날 아침 브리핑을 보낼 길이
    #    없다는 게 그제야 드러났다. 그래서 **어느 포맷을 보낼지 고르는 입력**으로 바꾼다.
    inputs:
      broadcast:
        description: "수동 실행에서 채널에 무엇을 보낼지 (none=안 보냄 · morning=어제 브리핑 · evening=마감 리포트)"
        type: choice
        default: none
        options:
          - none
          - morning
          - evening

jobs:
  # ── 예약 실행 건너뛰기 게이트 ──────────────────────────────────────────────
  #
  # 이 슬롯의 **본 발화** 뒤에 다른 실행이 이미 돌았거나 지금 돌고 있으면 이 실행을
  # 통째로 건너뛴다. 수동 실행이든 앞선 예약이든 가리지 않는다 — 백업 발화가 생기면서
  # "누가 이 슬롯을 이미 처리했나"가 판단 기준이 됐다.
  #
  # 2026-08-27 에 필요해졌다 — 깃헙 예약 큐가 밀려 저녁 실행이 두 시간 넘게 안 생겼고
  # (그날 아침 것은 207분 지각이었다), 손으로 대신 돌린 뒤 밀린 예약이 뒤늦게 풀리면
  # 두 실행이 겹친다. 겹치면 셋이 문제다.
  #
  #   1. 일곱 집계가 전량 삭제 후 삽입이라 같은 표를 동시에 쓰면 뒤엉킨다.
  #   2. 디시 표본은 '실행 직전 두 시간'이라, 늦게 돈 쪽이 눈금 밖 시간대의 값으로
  #      방금 받은 값을 덮어쓴다(눈금은 17:45~20:00 표본 기준으로 재보정돼 있다).
  #   3. 발송 조건을 양쪽이 다 만족해 같은 리포트가 두 번 나간다.
  #
  # ⚠️ **판단 기준은 '오늘 돌았나'가 아니라 '이 슬롯의 본 발화 뒤에 돌았나'다.** 아침에
  #    손으로 한 번 돌렸다고 저녁 예약까지 막으면 안 된다. 그래서 크론 문자열로 슬롯을
  #    되짚는데, 백업 발화(22:30·09:30)는 **본 발화(21:30·08:30)의 시각으로 묶는다.**
  #    그래야 백업이 "본 슬롯이 이미 처리됐나"를 보게 된다.
  #
  # ⚠️ **나보다 먼저 생긴 실행만 센다.** 본 발화와 백업이 동시에 도는 순간이 있으면
  #    서로를 보고 둘 다 빠지는 사고가 난다. `created_at` 이 나보다 앞선 것만(같으면
  #    run id 가 작은 것만) 세면 늦게 생긴 쪽만 빠진다.
  #
  # ⚠️ **너무 늦게 온 예약은 그냥 뺀다(2026-08-28).** 깃헙 예약이 몇 시간씩 늦게
  #    도착하는 날이 있는데, 그런 실행은 늦게 도는 게 아니라 **엉뚱한 시각에 엉뚱한
  #    일을 한다.** 실제로 08-28 에 아침 발화(21:30Z)가 8시간 2분 늦은 05:31Z 에
  #    도착했다. 그대로 뒀으면 (1) 아침 브리핑이 오후 4시에, 그것도 그날 이미 나간
  #    글과 같은 내용으로 한 번 더 나가고 (2) 디시 표본이 실행 직전 두 시간이라
  #    눈금(17:45~20:00) 밖의 값이 저장되고 (3) 조금만 더 늦었으면 저녁 예약과
  #    겹쳐 같은 표를 동시에 썼다.
  #
  #    상한은 **자기 발화 기준 120분**이다. 실측이 근거다 — 08-22~08-26 정상 열한
  #    건의 지각이 15~41분이고, 사고 셋은 207·481·641분이라 깨끗하게 갈린다. 백업
  #    발화도 자기 발화 기준이면 같은 범위라 안 걸린다.
  #
  #    ⚠️ **지각은 슬롯이 아니라 자기 크론의 발화로 잰다.** 백업(22:30·09:30)을 본
  #       발화(21:30·08:30) 기준으로 재면 늘 60분 늦은 것으로 잡혀 매번 빠진다.
  #       '누가 이 슬롯을 처리했나'는 슬롯으로 묶고, '내가 얼마나 늦었나'는 자기
  #       발화로 잰다. 두 시각이 다른 이유가 이것이다.
  #
  # ⚠️ **수동 실행이 실패했으면 막지 않는다.** 예약은 그 자체가 만회 수단이다.
  #    그래서 '성공했거나 아직 도는 중'인 수동 실행만 건너뛸 이유로 본다.
  #
  # ⚠️ **게이트가 고장 나면 열려야 한다.** 조회가 실패해도 skip 은 false 로 남고,
  #    update 잡의 조건도 `!cancelled()` 라 이 잡이 죽어도 파이프라인은 그냥 돈다.
  #    닫히는 쪽으로 고장 나면 매일 도는 파이프라인이 조용히 멈춘다.
  guard:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      skip: ${{ steps.decide.outputs.skip }}
    steps:
      - name: 이 슬롯을 이미 누가 처리했나
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
        run: |
          skip=false
          MAX_LATE_MIN=120   # 자기 발화보다 이만큼 넘게 늦은 예약은 빼는 상한(위 주석)
          if [ "$EVENT" = "schedule" ]; then
            # 백업 발화는 본 발화의 시각으로 묶는다(위 주석 참고).
            case "$CRON" in
              "30 21 * * *"|"30 22 * * *") fire_hm="21:30" ;;
              "30 8 * * *"|"30 9 * * *")   fire_hm="08:30" ;;
              *)                           fire_hm="" ;;
            esac
            if [ -n "$fire_hm" ]; then
              # 가장 가까운 과거의 발화 시각(UTC). 지연이 자정을 넘기면 오늘 날짜로
              # 잡은 값이 미래가 되므로 하루를 뺀다 — 2026-08-27 아침이 실제로 그랬다
              # (08-26 21:30 발화 → 08-27 00:57 실행).
              now=$(date -u +%s)
              fire=$(date -u -d "$(date -u +%Y-%m-%d) $fire_hm" +%s)
              [ "$fire" -gt "$now" ] && fire=$(( fire - 86400 ))
              since=$(date -u -d "@$fire" +%Y-%m-%dT%H:%M:%SZ)
              # 내 생성 시각을 못 읽으면 게이트는 그냥 연다(닫히는 쪽으로 고장 나면 안 된다).
              mine=$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq ".created_at" 2>/dev/null || true)
              if [ -z "$mine" ]; then
                echo "내 실행 생성 시각을 못 읽어 게이트를 엽니다 — 그대로 진행합니다"
              else
                # ① 지각 상한 — '내가 지금 도는 게 의미 있는 시각인가'.
                #    자기 크론의 발화로 재고, 기준 시각은 실행이 **생성된** 때다
                #    (게이트 잡이 시작한 때가 아니라).
                case "$CRON" in
                  "30 21 * * *") own_hm="21:30" ;;
                  "30 22 * * *") own_hm="22:30" ;;
                  "30 8 * * *")  own_hm="08:30" ;;
                  "30 9 * * *")  own_hm="09:30" ;;
                  *)             own_hm="" ;;
                esac
                mine_epoch=$(date -u -d "$mine" +%s)
                own=$(date -u -d "$(date -u -d "$mine" +%Y-%m-%d) $own_hm" +%s)
                [ "$own" -gt "$mine_epoch" ] && own=$(( own - 86400 ))
                late=$(( (mine_epoch - own) / 60 ))
              fi
              if [ "$skip" = "false" ] && [ -n "$mine" ] && [ -n "$own_hm" ] && [ "$late" -gt "$MAX_LATE_MIN" ]; then
                skip=true
                echo "발화 ${own_hm}Z 보다 ${late}분 늦게 생긴 예약이라 건너뜁니다(상한 ${MAX_LATE_MIN}분)"
                {
                  echo "## 예약 실행을 건너뜀 — 너무 늦게 도착"
                  echo "발화 \`${own_hm}Z\` 대비 **${late}분** 늦게 생성됐습니다(상한 ${MAX_LATE_MIN}분)."
                  echo "이 시각에 돌면 발송·표본 시간대가 어긋나므로 아무것도 하지 않습니다."
                } >> "$GITHUB_STEP_SUMMARY"
              elif [ -n "$mine" ]; then
                # ② 이 슬롯을 이미 누가 처리했나.
                q=".workflow_runs[]"
                q="$q | select(.created_at >= \"$since\")"
                q="$q | select(.created_at < \"$mine\" or (.created_at == \"$mine\" and .id < $GITHUB_RUN_ID))"
                q="$q | select(.status != \"completed\" or .conclusion == \"success\")"
                q="$q | .html_url"
                hit=$(gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/daily-update.yml/runs?per_page=30" --jq "$q" 2>/dev/null | head -1 || true)
                if [ -n "$hit" ]; then
                  skip=true
                  echo "발화 $since 뒤에 이 슬롯을 이미 처리한 실행이 있어 건너뜁니다: $hit"
                  echo "## 예약 실행을 건너뜀" >> "$GITHUB_STEP_SUMMARY"
                  echo "발화 \`$since\` 뒤의 실행이 이 슬롯을 대신했습니다: $hit" >> "$GITHUB_STEP_SUMMARY"
                else
                  echo "발화 $since 뒤에 앞선 실행이 없습니다 — 그대로 진행합니다"
                fi
              fi
            fi
          else
            echo "예약 실행이 아닙니다($EVENT) — 게이트는 예약에만 건다"
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

  update:
    needs: guard
    # 게이트가 막았을 때만 건너뛴다. `!cancelled()` 로 두는 건 게이트 잡 자체가
    # 죽어도(needs 가 실패하면 기본적으로 뒤가 통째로 skip 된다) 파이프라인은
    # 돌게 하기 위해서다 — 위 '열려야 한다' 주석 참고.
    if: ${{ !cancelled() && needs.guard.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    # 실패 시 알림 이슈를 열 수 있도록 issues 쓰기 권한 부여(감지 레이어).
    permissions:
      contents: read
      issues: write
    env:
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      # NAVER API HUB 키 하나로 뉴스·검색어트렌드를 모두 호출한다.
      NAVER_HUB_KEY_ID: ${{ secrets.NAVER_HUB_KEY_ID }}
      NAVER_HUB_KEY: ${{ secrets.NAVER_HUB_KEY }}
      KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
      # ⚠️ 예탁원(서학개미 결제). 시크릿은 2026-08-10 에 등록돼 있었는데 **여기 줄이 없어서
      #    스텝까지 안 내려갔다.** 그대로 뒀으면 첫 실행에서 예탁원 스텝이 키 없음으로
      #    죽고 알림만 열렸을 것이다 — 로컬에서는 .env.local 로 잘 돌아서 안 보인다.
      KSD_API_KEY: ${{ secrets.KSD_API_KEY }}
      ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
      ALADIN_TTB_KEY: ${{ secrets.ALADIN_TTB_KEY }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      KMA_API_KEY: ${{ secrets.KMA_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
      TELEGRAM_CHANNELS_SHEET_ID: ${{ secrets.TELEGRAM_CHANNELS_SHEET_ID }}
      # 채널 발송 전용(수집용 TELEGRAM_SESSION 과 별개인 봇 토큰). 아래 발송 스텝만 쓴다.
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_BROADCAST_CHAT_ID: ${{ secrets.TELEGRAM_BROADCAST_CHAT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r data-pipeline/requirements.txt


      # ── 카더라 리포트(텔레그램) 파이프라인 ──────────────────────────────
      # 위 지표 파이프라인과 독립적이며, 자기들끼리는 순서 의존이 있다:
      #   상장사 사전 → 채널 동기화/구독자 스냅샷 → 메시지 수집 → 채널 영향력
      #   → 종목 추출 → 종목 일별 집계.
      # 각 스텝은 DB에서 읽어 이어가므로 하나가 실패해도 다음 스텝은 직전까지의
      # 저장분으로 동작한다(graceful degradation). 지표용 실패 알림/요약과는
      # 분리하려고 아래 Summarize results 집계 배열에는 넣지 않는다.
      # 대신 이 파이프라인의 '재료' 두 스텝(sync·fetch)만 따로 재는 집계·알림이
      # 잡 끝에 붙어 있다(Summarize 카더라 collection).
      # ── 내부자 리포트 ───────────────────────────────────────────────────
      # ⚠️⚠️ **맨 앞에 둔다. 뒤로 옮기지 말 것.**
      #
      # 이 넷은 SEC·미 하원·stockanalysis 를 읽고 자기 표(us_insider_*·us_manager_*·
      # us_congress_trade·us_analyst_*)에만 쓴다. KRX 도 카더라 표도 안 본다(us_stocks
      # 만 읽는데 그건 종목 사전이라 이 흐름에서 안 바뀐다). **아무것도 안 기다려도 된다.**
      #
      # 한때 지표 블록 **뒤**(47번째)에 있었다. 그러면 중간의 'KRX 공표(08:00 KST) 대기'
      # 게이트에 같이 걸린다 — KRX 와 무관한데 줄만 뒤에 서 있어서다. 2026-08-25 밤
      # 22:55 에 리허설을 돌렸더니 자정을 넘겨 게이트가 **7시간 반**을 자기 시작했고,
      # 잡의 6시간 제한이 먼저 와서 내부자 스텝은 시작조차 못 하고 잘렸다.
      # 잡 하나에 스텝을 줄로 세운 구조라, 가운데 sleep 은 뒤의 모든 것을 멈춘다.
      #
      # ⭐ 앞에 두면 덤이 둘이다. 아무 시각에 dispatch 해도 바로 검증되고, 평소 실행에서도
      #   내부자 화면이 카더라·지표보다 먼저 새로워진다.
      # ⚠️ 대가는 카더라 시작이 그만큼 늦어지는 것이다 — 평소 5~6분(임원+의원+애널리스트),
      #   13F 가 도는 달의 열엿새는 15분 안팎. 카더라 완료가 08:45~09:05 라 출근 시간대
      #   반영에는 영향이 없다고 봤다.
      # ⚠️⚠️ 이 화면도 **파이프라인에 안 붙어 있었다**(2026-08-21 까지). 지금 들어 있는
      #    데이터는 전부 손으로 돌려 채운 것이라, 안 붙이면 하루 만에 낡는다.
      #
      # ⭐ 임원 축은 **최근 5영업일만** 훑는다. 집계(us_insider_daily)는 저장한 뒤
      #    **DB 의 창을 읽어** 만들기 때문에 조금씩 받아도 90일 창이 제대로 나온다.
      #    예전처럼 매 실행 90일을 훑으면 인덱스 65일 × 공시 수백 건이라 20분이 넘는다.
      # ⚠️ EDGAR 일별 인덱스는 그날 접수가 끝난 뒤(미 동부 22:00 ≈ 11:00 KST) 만들어진다.
      #    **아침 실행(07:30 KST)엔 전날 미국분이 아직 없고 오후 실행에서 잡힌다.**
      #    5영업일을 되돌아보므로 어느 실행이 놓쳐도 다음이 만회한다.
      - name: Fetch 미국 임원 공시 Form 4 (내부자 리포트)
        id: us_insider
        continue-on-error: true
        run: python data-pipeline/scripts/fetch_us_insider.py

      # ⭐ 하원은 증분이다 — 이미 읽은 doc_id 와 `최근 신고일 − 7일` 기준선으로 건너뛴다
      #    (5~8분 → 3.5초). 토요일만 전량 다시 읽어 뒤늦게 고쳐진 신고를 줍는다.
      - name: Fetch 미 하원의원 매매 신고 (내부자 리포트)
        id: us_congress
        continue-on-error: true
        run: |
          if [ "$(date -u +%u)" = "6" ]; then
            echo "토요일 — 전량 다시 읽는다"
            python data-pipeline/scripts/fetch_us_congress.py --full
          else
            python data-pipeline/scripts/fetch_us_congress.py
          fi

      # ⚠️ 13F 는 **분기 자료라 매일 돌릴 이유가 없다.** 값이 안 바뀐다. 마감이
      #    분기말+45일(2/14 · 5/15 · 8/14 · 11/14)이고 그 며칠 전부터 제출이 몰리므로
      #    그 창에서만 돌린다. 한 번에 62곳 × 두 분기 + fails 파일 6개라 10분 안팎이다.
      # ⚠️ 마감이 주말이면 다음 영업일로 밀리므로 25일까지 넉넉히 열어 둔다.
      - name: Fetch 월가 거물 13F (내부자 리포트)
        id: us_13f
        continue-on-error: true
        run: |
          m=$(date -u +%m); d=$(date -u +%d)
          case "$m" in
            02|05|08|11)
              if [ "$d" -ge 10 ] && [ "$d" -le 25 ]; then
                python data-pipeline/scripts/fetch_us_13f.py
              else
                echo "13F 제출 창 밖($m/$d). 건너뛴다."
              fi
              ;;
            *) echo "13F 마감 달이 아니다($m). 건너뛴다." ;;
          esac

      # ⚠️⚠️ 이건 API 가 아니라 **웹페이지**다(stockanalysis.com). 저쪽이 화면을 바꾸면
      #    파싱이 깨진다. 못 받은 비율이 30% 를 넘거나 한 종목도 못 받으면 **스크립트가
      #    스스로 죽어** 아래 요약이 실패로 잡고 알림 이슈가 열린다.
      #    ⛔ 그 가드를 경고 출력으로 되돌리지 말 것 — 한동안 찍기만 하고 0 으로 끝나서
      #       "성공했는데 0건"을 알아챌 방법이 아예 없었다(2026-08-25 에 고쳤다).
      #    ⭐ 죽는 자리는 **저장 다음**이다. 앞에서 죽으면 그날 받아 둔 것까지 잃는다.
      # ⚠️ 하루 한 번이면 충분하다. 애널리스트 의견은 하루에 몇 건씩만 바뀐다. 179종목을
      #    1초 간격으로 받아 3분쯤 걸린다.
      # ⭐ 원천이 기준 시점을 안 줘서 **받은 날짜로 쌓는다.** 그래서 매일 돌리는 것이
      #    곧 추이를 만드는 일이다 — 건너뛴 날은 영영 못 메운다.
      - name: Fetch 애널리스트 컨센서스 (내부자 리포트)
        id: us_analyst
        continue-on-error: true
        run: python data-pipeline/scripts/fetch_us_analyst.py

      - name: (텔레그램) KRX 상장종목 마스터 갱신
        id: telegram_krx_stocks
        continue-on-error: true
        run: python data-pipeline/scripts/fetch_krx_stocks.py


      - name: (텔레그램) 채널 동기화 + 구독자 스냅샷
        id: telegram_sync
        continue-on-error: true
        run: python data-pipeline/scripts/sync_telegram_channels.py

      - name: (텔레그램) 메시지 수집
        id: telegram_fetch
        continue-on-error: true
        run: python data-pipeline/scripts/fetch_telegram.py

      # 위 수집기가 재는 것은 '총 몇 건'이고, 이 스텝이 재는 것은 '며칠째 몇 개 채널'이다.
      # 문턱을 하나 더 얹지 않고 따로 둔 이유는 그 스크립트 main() 끝 주석에 있다 —
      # 0건 문턱을 비율로 바꾸면 캐시가 차는 중인 정상적인 날에도 울린다. 연속 일수는
      # 그 반례를 통과시키면서 '오래 낮은' 상태만 잡는다(판정 근거는 이 스크립트 주석).
      # 수집기 바로 뒤여야 오늘 칸이 채워진 상태로 잰다.
      - name: (텔레그램) 수집 커버리지 검사
        id: telegram_coverage
        continue-on-error: true
        run: python data-pipeline/scripts/check_telegram_coverage.py

      # 분류는 Batch API(토큰 값 절반)로 보내므로 응답 시각을 우리가 정할 수 없다.
      # 그래서 수집 직후 제출해 두고, 아래 집계 스텝들이 도는 20~30분을 대기 시간으로
      # 쓴 뒤 집계 직전에 수거한다. 그 안에 안 끝난 배치는 다음 실행이 가져간다.
      - name: (텔레그램) 메시지 LLM 분류 — 수거 + 제출
        id: telegram_analyze
        continue-on-error: true
        run: python data-pipeline/scripts/analyze_telegram_messages.py

      - name: (텔레그램) 채널 영향력 점수
        id: telegram_influence
        continue-on-error: true
        run: python data-pipeline/scripts/calculate_channel_influence.py

      - name: (텔레그램) 종목 추출
        id: telegram_extract
        continue-on-error: true
        run: python data-pipeline/scripts/extract_telegram_stocks.py

      - name: (텔레그램) 종목 일별 집계
        id: telegram_stock_daily
        continue-on-error: true
        run: python data-pipeline/scripts/calculate_stock_daily.py

      # ── 미장 카더라 ────────────────────────────────────────────────────
      # 같은 메시지를 미국 종목 사전으로 한 번 더 읽는다. 수집을 새로 하지 않는다 —
      # 317개 채널 중 284개가 이미 미국 종목을 말하고 있고, 그중 79%는 제목에
      # '미국'이 안 붙은 평범한 국내 채널이다.
      #
      # ⚠️ 국내 추출(telegram_extract) **뒤에** 와야 한다. 동시 언급 집계가
      #    telegram_message_stocks 를 읽는데, 국내 추출이 그걸 매 실행 전량 재생성한다.
      - name: (텔레그램) 미국 종목 추출
        id: telegram_us_extract
        continue-on-error: true
        run: python data-pipeline/scripts/extract_telegram_us_stocks.py

      - name: (텔레그램) 미국 종목·채널 일별 집계
        id: telegram_us_daily
        continue-on-error: true
        run: python data-pipeline/scripts/calculate_us_stock_daily.py

      - name: (텔레그램) 미국×국내 동시 언급
        id: telegram_us_comention
        continue-on-error: true
        run: python data-pipeline/scripts/calculate_us_comention.py

      # 미장 트렌딩·테마는 미국 종목 추출 바로 뒤여도 되지만(입력이 telegram_message_us_stocks
      # 와 telegram_us_stock_daily 뿐), 국내 짝 옆에 둔다 — 같은 종류의 계산이 흩어져 있으면
      # 나중에 "이게 왜 여기 있지"를 다시 풀어야 한다.
      - name: (텔레그램) 미장 트렌딩 메시지 선별
        id: telegram_us_trending
        continue-on-error: true
        run: python data-pipeline/scripts/calculate_us_trending.py

      - name: (텔레그램) 미장 테마 일별 집계
        id: telegram_us_theme
        continue-on-error: true
        run: python data-pipeline/scripts/calculate_us_theme_daily.py

      - name: (텔레그램) 트렌딩 메시지 선별
        id: telegram_trending
        continue-on-error: true
        run: python data-pipeline/scripts/calculate_telegram_trending.py

      - name: (텔레그램) 테마 일별 집계
        id: telegram_theme_daily
        continue-on-error: true
        run: python data-pipeline/scripts/calculate_theme_daily.py

      # LLM 계층 — 메시지별 분류(돈이 드는 단계, 증분) → 결정적 집계 → 문장 생성.
      # 분류가 실패해도 집계는 직전까지 저장된 분류분으로 돌고, 집계가 실패하면
      # 문장 생성이 조용히 건너뛴다. 위 스텝들과 마찬가지로 실패 알림과는 분리한다.
      # 위에서 제출한 배치를 여기서 수거한다(제출은 하지 않는다 — --collect-only).
      - name: (텔레그램) 메시지 LLM 분류 — 수거
        id: telegram_analyze_collect
        continue-on-error: true
        run: python data-pipeline/scripts/analyze_telegram_messages.py --collect-only

      - name: (텔레그램) 센티먼트·화제어 집계
        id: telegram_sentiment
        continue-on-error: true
        run: python data-pipeline/scripts/calculate_telegram_sentiment.py

      # ⚠️ **미장 센티먼트는 여기 있어야 한다** — 위 미장 세 스텝 옆이 아니다.
      #    입력이 `telegram_message_analysis` 라, 그날 분류를 수거하는
      #    telegram_analyze_collect **뒤에** 와야 오늘치를 센다. 앞에 두면 조용히
      #    어제 분류로 오늘 카드를 그린다(실패도 안 나서 알아채기 어렵다).
      #    국내 센티먼트 집계와 같은 자리인 것은 그래서다.
      - name: (텔레그램) 미장 센티먼트·화제어 집계
        id: telegram_us_sentiment
        continue-on-error: true

name: Daily Indicator Update

on:
  schedule:
    # ⚠️ 발화 시각 ≠ 실제 실행 시각. GitHub 예약 큐가 실측 90~150분 밀어서, 발화한 뒤
    # 그만큼 지나 실제로 시작한다. 이 지연을 역이용해 실제 실행이 KST 원하는 시각에
    # 떨어지도록 발화를 그보다 앞에 잡는다. (완료 시각 표기는 lib/format.ts
    # SCHEDULED_HOURS_KST=[11,19] 와 연동.)
    #
    # ── 아침 ── 00:00 UTC 발화 → 큐 지연 ~100분 → 실제 실행 ~10:45 KST → 완료 ~11:00.
    # 이 타이밍이 핵심이다: KRX Open API 는 **전날 자료를 그날 오전에야 올린다** — 실측상
    # 07:40 엔 없고 ~10:44 실행이 받는다(성공한 실행은 매일 10:30~10:50 에 어제치를 받았다).
    # 실행이 10:30 이전이면 어제 자료를 못 받고 그제치가 된다. 00:00 UTC 는 전 세계에서 가장
    # 붐비는 슬롯이라 지연이 안정적으로 ~100분 나와 실행이 KRX 공표 직후로 밀린다 — 즉
    # **여기선 붐비는 슬롯이 오히려 유리하다. 앞당기거나 딴 슬롯으로 옮기지 말 것**(그러면
    # 지연이 줄어 KRX 공표 전에 실행돼 어제 자료를 놓친다).
    #
    # ⚠️ 2026-07-29 에 **지수 종가만** 야후로 옮겼지만(fetch_kospi_high_gap·
    # fetch_kosdaq_ratio), 이 제약은 그대로다 — 거래대금·VKOSPI·풋콜·시가총액·선물
    # 미결제약정·전종목 거래대금은 야후에 없어 여전히 KRX 이고 여전히 T+1 이다.
    - cron: "0 0 * * *" # 발화 09:00 KST → 실제 실행 ~10:45 → 완료 ~11:00 (KRX 안전선)
    # ── 오후 ── 발화 08:30 UTC(17:30 KST) → 큐 지연 ~140분 → 실제 실행 ~19:50 → 완료
    # ~20:20. 화면은 오후 7시로 스냅한다(표기는 완료를 ±3시간 안에서 정각 스냅,
    # lib/format.ts SCHEDULED_HOURS_KST). 실제 완료가 ~8시라 7시 표기는 ~1시간 이른
    # 바닥값이다. 아침 실패 자동 만회 + 미국 야간/오후 데이터 재조회를 겸한다.
    #
    # ⚠️ **이 실행에 시각 하한이 생겼다(2026-07-29). 16:00 KST 보다 앞당기지 말 것.**
    # 지수 종가를 야후에서 받게 되면서, **그날 종가를 담는 실행은 오후 하나뿐**이 됐다
    # (아침 ~10:45 는 정규장 한복판이라 common/yahoo_client.py 가 장중값을 일부러 버린다).
    # 16:00 은 정규장 마감 15:30 에 여유 30분을 더한 값이다 — 야후가 마감 직후 몇 분 동안
    # 낡은 값을 주는 걸 실측했다(2026-07-28 15:16~15:37). 이 실행을 16:00 앞으로 옮기면
    # 그날 종가가 통째로 하루 밀린다.
    - cron: "30 8 * * *" # 발화 17:30 KST → 실제 실행 ~19:50 → 완료 ~20:20 (표기 오후 7시)
  workflow_dispatch:
    inputs:
      send_telegram:
        description: "텔레그램 채널에 오늘의 지수를 발송한다 (예약 실행이 아닌 수동 실행에서는 기본으로 안 보낸다)"
        type: boolean
        default: false

jobs:
  update:
    runs-on: ubuntu-latest
    # 실패 시 알림 이슈를 열 수 있도록 issues 쓰기 권한 부여(감지 레이어).
    permissions:
      contents: read
      issues: write
    env:
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      # NAVER API HUB 키 하나로 뉴스·검색어트렌드를 모두 호출한다.
      NAVER_HUB_KEY_ID: ${{ secrets.NAVER_HUB_KEY_ID }}
      NAVER_HUB_KEY: ${{ secrets.NAVER_HUB_KEY }}
      KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
      ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
      ALADIN_TTB_KEY: ${{ secrets.ALADIN_TTB_KEY }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      KMA_API_KEY: ${{ secrets.KMA_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
      TELEGRAM_CHANNELS_SHEET_ID: ${{ secrets.TELEGRAM_CHANNELS_SHEET_ID }}
      # 채널 발송 전용(수집용 TELEGRAM_SESSION 과 별개인 봇 토큰). 아래 발송 스텝만 쓴다.
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_BROADCAST_CHAT_ID: ${{ secrets.TELEGRAM_BROADCAST_CHAT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r data-pipeline/requirements.txt


      - name: Fetch KOSPI 52-week-high gap
        id: kospi_high_gap
        continue-on-error: true
        run: python data-pipeline/scripts/fetch_kospi_high_gap.py

      - name: Fetch Buffett index
        id: buffett_index
        continue-on-error: true
        run: python data-pipeline/scripts/fetch_buffett_index.py

      - name: Fetch consumer sentiment (CCSI · 실물 축)
        id: consumer_sentiment
        continue-on-error: true
        run: python data-pipeline/scripts/fetch_consumer_sentiment.py

      - name: Fetch turnover concentration (거래대금 쏠림)
        id: turnover_concentration
        continue-on-error: true
        run: python data-pipeline/scripts/fetch_turnover_concentration.py

      - name: Fetch Naver search trend
        id: naver_trend
        continue-on-error: true
        run: python data-pipeline/scripts/fetch_naver_trend.py

      - name: Fetch Naver luxury/import car search trend
        id: naver_luxury_car_trend
        continue-on-error: true
        run: python data-pipeline/scripts/fetch_naver_luxury_car_trend.py

      - name: Fetch Naver lifestyle search trend (fine dining, small business crisis)
        id: naver_lifestyle_trend
        continue-on-error: true
        run: python data-pipeline/scripts/fetch_naver_lifestyle_trend.py

      - name: Fetch DCInside stock gallery sentiment
        id: dcinside
        continue-on-error: true
        run: python data-pipeline/scripts/fetch_dcinside_stock.py

      - name: Fetch KOSPI trading value surge
        id: kospi_volume
        continue-on-error: true
        run: python data-pipeline/scripts/fetch_kospi_volume.py

      - name: Fetch VKOSPI
        id: vkospi
        continue-on-error: true
        run: python data-pipeline/scripts/fetch_vkospi.py

      - name: Fetch option put/call ratio
        id: put_call_ratio
        continue-on-error: true
        run: python data-pipeline/scripts/fetch_put_call_ratio.py

      - name: Fetch news headline sentiment
        id: news_sentiment
        continue-on-error: true
        run: python data-pipeline/scripts/fetch_news_sentiment.py

      - name: Fetch KOSPI-vs-gold ratio
        id: gold_ratio
        continue-on-error: true
        run: python data-pipeline/scripts/fetch_gold_ratio.py

      - name: Fetch KOSDAQ-vs-KOSPI ratio
        id: kosdaq_ratio
        continue-on-error: true
        run: python data-pipeline/scripts/fetch_kosdaq_ratio.py

      - name: Fetch USD/KRW volatility
        id: usdkrw_volatility
        continue-on-error: true
        run: python data-pipeline/scripts/fetch_usdkrw_volatility.py

      - name: Fetch leverage ETF trade value + KOSPI200 futures open interest
        id: leverage_etf
        continue-on-error: true
        run: python data-pipeline/scripts/fetch_leverage_etf_volume.py

      - name: Fetch bestseller finance book ratio
        id: bestseller_ratio
        continue-on-error: true
        run: python data-pipeline/scripts/fetch_bestseller_ratio.py

      - name: Fetch YouTube finance search views
        id: youtube_finance_search
        continue-on-error: true
        run: python data-pipeline/scripts/fetch_youtube_finance_search.py


      - name: Fetch KOSPI-vs-Asia relative strength
        id: asia_relative_strength
        continue-on-error: true
        run: python data-pipeline/scripts/fetch_asia_relative_strength.py

      - name: Fetch Upbit speculation index
        id: upbit_speculation
        continue-on-error: true
        run: python data-pipeline/scripts/fetch_upbit_speculation.py


      - name: Fetch GitHub trading bot repo count
        id: github_trading_repos
        continue-on-error: true
        run: python data-pipeline/scripts/fetch_github_trading_repos.py

      - name: Fetch brokerage app store rank
        id: brokerage_app_rank
        continue-on-error: true
        run: python data-pipeline/scripts/fetch_brokerage_app_rank.py

      - name: Fetch foreign net selling at index highs
        id: foreign_sell_at_high
        continue-on-error: true
        run: python data-pipeline/scripts/fetch_foreign_sell_at_high.py

      - name: Fetch limit-up breadth (급등 종목 강도)
        id: limit_up_breadth
        continue-on-error: true
        run: python data-pipeline/scripts/fetch_limit_up_breadth.py

      - name: Fetch market actions (sidecar/CB) index
        id: market_actions
        continue-on-error: true
        run: python data-pipeline/scripts/fetch_market_actions.py

      - name: Calculate overheating score
        id: calculate_score
        continue-on-error: true
        run: python data-pipeline/scripts/calculate_score.py

      # 위 스텝들이 전부 success 여도 데이터가 안 들어왔을 수 있다 — 소스가 자료를
      # 안 주면 fetch 는 "휴장일 등 N건 제외"만 찍고 정상 종료하기 때문이다. 자료
      # 기준일이 허용 영업일을 넘기면 여기서 실패시켜 알림이 뜨게 한다.
      - name: Check indicator freshness (자료 정체 감시)
        id: check_freshness
        continue-on-error: true
        run: python data-pipeline/scripts/check_freshness.py

      # 점수 계산 뒤, 최신 daily_score/지표들을 LLM으로 2~3문장 요약해
      # daily_score.ai_summary에 저장한다(히어로 카드용). 비필수 단계라
      # continue-on-error로 돌리고, 아래 실패 집계(Summarize results)에는
      # 넣지 않는다 — 요약 생성 실패가 실패 알림 이슈를 열지 않도록.
      - name: Generate daily AI summary (히어로 요약)
        id: generate_daily_summary
        continue-on-error: true
        run: python data-pipeline/scripts/generate_daily_summary.py

      # ── 카더라 리포트(텔레그램) 파이프라인 ──────────────────────────────
      # 위 지표 파이프라인과 독립적이며, 자기들끼리는 순서 의존이 있다:
      #   상장사 사전 → 채널 동기화/구독자 스냅샷 → 메시지 수집 → 채널 영향력
      #   → 종목 추출 → 종목 일별 집계.
      # 각 스텝은 DB에서 읽어 이어가므로 하나가 실패해도 다음 스텝은 직전까지의
      # 저장분으로 동작한다(graceful degradation). 지표용 실패 알림/요약과는
      # 분리하려고 아래 Summarize results 집계 배열에는 넣지 않는다.
      # 대신 이 파이프라인의 '재료' 두 스텝(sync·fetch)만 따로 재는 집계·알림이
      # 잡 끝에 붙어 있다(Summarize 카더라 collection).
      - name: (텔레그램) KRX 상장종목 마스터 갱신
        id: telegram_krx_stocks
        continue-on-error: true
        run: python data-pipeline/scripts/fetch_krx_stocks.py


      - name: (텔레그램) 채널 동기화 + 구독자 스냅샷
        id: telegram_sync
        continue-on-error: true
        run: python data-pipeline/scripts/sync_telegram_channels.py

      - name: (텔레그램) 메시지 수집
        id: telegram_fetch
        continue-on-error: true
        run: python data-pipeline/scripts/fetch_telegram.py

      # 위 수집기가 재는 것은 '총 몇 건'이고, 이 스텝이 재는 것은 '며칠째 몇 개 채널'이다.
      # 문턱을 하나 더 얹지 않고 따로 둔 이유는 그 스크립트 main() 끝 주석에 있다 —
      # 0건 문턱을 비율로 바꾸면 캐시가 차는 중인 정상적인 날에도 울린다. 연속 일수는
      # 그 반례를 통과시키면서 '오래 낮은' 상태만 잡는다(판정 근거는 이 스크립트 주석).
      # 수집기 바로 뒤여야 오늘 칸이 채워진 상태로 잰다.
      - name: (텔레그램) 수집 커버리지 검사
        id: telegram_coverage
        continue-on-error: true
        run: python data-pipeline/scripts/check_telegram_coverage.py

      # 분류는 Batch API(토큰 값 절반)로 보내므로 응답 시각을 우리가 정할 수 없다.
      # 그래서 수집 직후 제출해 두고, 아래 집계 스텝들이 도는 20~30분을 대기 시간으로
      # 쓴 뒤 집계 직전에 수거한다. 그 안에 안 끝난 배치는 다음 실행이 가져간다.
      - name: (텔레그램) 메시지 LLM 분류 — 수거 + 제출
        id: telegram_analyze
        continue-on-error: true
        run: python data-pipeline/scripts/analyze_telegram_messages.py

      - name: (텔레그램) 채널 영향력 점수
        id: telegram_influence
        continue-on-error: true
        run: python data-pipeline/scripts/calculate_channel_influence.py

      - name: (텔레그램) 종목 추출
        id: telegram_extract
        continue-on-error: true
        run: python data-pipeline/scripts/extract_telegram_stocks.py

      - name: (텔레그램) 종목 일별 집계
        id: telegram_stock_daily
        continue-on-error: true
        run: python data-pipeline/scripts/calculate_stock_daily.py

      - name: (텔레그램) 트렌딩 메시지 선별
        id: telegram_trending
        continue-on-error: true
        run: python data-pipeline/scripts/calculate_telegram_trending.py

      - name: (텔레그램) 테마 일별 집계
        id: telegram_theme_daily
        continue-on-error: true
        run: python data-pipeline/scripts/calculate_theme_daily.py

      # LLM 계층 — 메시지별 분류(돈이 드는 단계, 증분) → 결정적 집계 → 문장 생성.
      # 분류가 실패해도 집계는 직전까지 저장된 분류분으로 돌고, 집계가 실패하면
      # 문장 생성이 조용히 건너뛴다. 위 스텝들과 마찬가지로 실패 알림과는 분리한다.
      # 위에서 제출한 배치를 여기서 수거한다(제출은 하지 않는다 — --collect-only).
      - name: (텔레그램) 메시지 LLM 분류 — 수거
        id: telegram_analyze_collect
        continue-on-error: true
        run: python data-pipeline/scripts/analyze_telegram_messages.py --collect-only

      - name: (텔레그램) 센티먼트·화제어 집계
        id: telegram_sentiment
        continue-on-error: true
        run: python data-pipeline/scripts/calculate_telegram_sentiment.py

      - name: (텔레그램) 총평·종목 요약 생성
        id: telegram_narratives
        continue-on-error: true
        run: python data-pipeline/scripts/generate_telegram_narratives.py

      # ── 채널 발송 ────────────────────────────────────────────────────────
      # 유일하게 밖으로 나가는 스텝이다. 구독자 전원에게 한 번 나간 숫자는 되돌릴 수
      # 없으므로 조건이 셋이고, 셋 다 이유가 다르다.
      #
      # [1] 하루 한 번만 — `github.event.schedule == '30 8 * * *'`
      #   이 워크플로는 하루 두 번 돈다(아침 = KRX 종가 확보, 오후 = 아침 실패 만회).
      #   그냥 끝에 붙이면 같은 내용이 두 번 나간다. 오후 실행만 고른 이유는 그게 장
      #   마감(15:30 KST) 뒤이고, 아침이 실패했어도 오후가 만회한 뒤라 가장 온전한
      #   데이터를 들고 있기 때문이다. 아침에 보내면 '오늘의 온도'가 장이 열리기도 전
      #   값이 된다. 대가는 하나 — 오후 실행이 통째로 실패한 날은 그날 발송이 없다.
      #   그건 의도한 것이다(안 보내는 것 < 틀린 걸 보내는 것).
      #
      # [2] 재실행에서는 안 보냄 — `github.run_attempt == 1`
      #   예약 실행을 'Re-run all jobs' 로 다시 돌리면 event.schedule 이 그대로라
      #   [1]만으로는 두 번째 발송을 못 막는다. 재실행은 대개 앞 스텝이 실패해서 하는
      #   것이고, 그때 이미 발송된 글이 한 번 더 나가면 안 된다. 재실행 뒤에 정말
      #   보내야 하면 아래 [3] 수동 실행을 쓴다.
      #
      # [3] 수동 실행은 명시적 opt-in — `github.event.inputs.send_telegram == 'true'`
      #   workflow_dispatch 기본값이 false 라, 손으로 돌리는 실행은 기본적으로 조용하다.
      #   보내려면 체크박스를 켜야 한다. [2]에 막힌 날의 탈출구이기도 하다.
      #
      #   ⚠️ **`inputs.send_telegram` 으로 줄이지 말 것.** 함정이 둘이다. (a) `inputs`
      #   컨텍스트는 workflow_dispatch/workflow_call 에서만 채워져서, 예약 실행에서 이걸
      #   읽는 건 보장된 동작이 아니다. (b) `github.event.inputs.*` 는 boolean 으로
      #   선언해도 **문자열**로 온다 — 체크를 껐을 때 값이 `'false'` 인데, 빈 문자열이
      #   아니라서 조건식에서는 **참**이 된다. 즉 `github.event.inputs.send_telegram`
      #   만 쓰면 수동 실행이 늘 발송된다. `== 'true'` 비교가 둘 다 막는다.
      #
      # [4] 낡은 값 차단 — check_freshness / calculate_score 결과
      #   두 스텝 다 continue-on-error 라 실패해도 잡이 계속 흐른다. 그래서 outcome 을
      #   직접 본다. 자료가 정체됐거나(check_freshness) 점수 계산이 죽었으면
      #   (calculate_score) 화면엔 어제 값이 남는데, 그걸 방송하면 회수가 안 된다.
      #   스크립트 안에도 같은 취지의 게이트가 하나 더 있다(daily_score 행 날짜 검사) —
      #   워크플로 밖에서 손으로 돌릴 때를 막기 위해서다.
      # [5] 요일 판정 — 아래 네 발송 스텝이 공유한다.
      #   **KST 기준으로 센다.** 러너는 UTC 라 `date +%u` 를 그냥 쓰면 요일이 밀릴 수
      #   있다(오후 실행 19:50 KST = 10:50 UTC 라 지금은 같은 날이지만, 큐 지연이 커지면
      #   경계에 걸린다). TZ 를 박아 두면 그 걱정이 없다.
      #
      #   GitHub 표현식에서 숫자 비교를 하려 들지 말고 여기서 참/거짓을 만들어 넘긴다 —
      #   outputs 는 늘 문자열이라 `<= 5` 같은 비교가 조용히 어긋날 수 있다.
      - name: (텔레그램) 발송 요일 판정
        id: broadcast_when
        if: always()
        run: |
          DOW=$(TZ=Asia/Seoul date +%u)   # 1=월 … 7=일
          KST=$(TZ=Asia/Seoul date '+%Y-%m-%d(%a) %H:%M')
          weekday=false
          [ "$DOW" -le 5 ] && weekday=true
          echo "weekday=$weekday" >> "$GITHUB_OUTPUT"
          echo "KST $KST · DOW=$DOW · 평일=$weekday"

      # ── 발송 두 건 ────────────────────────────────────────────────────────
      # 이 워크플로가 보내는 건 파이프라인에 붙는 둘뿐이다.
      #
      #   월~금 아침(파이프라인 완료 + 5분)  A 어제 브리핑
      #   월~금 저녁(파이프라인 완료 + 5분)  B 마감 리포트
      #
      # 나머지 둘(C 관심 이동·D 주간 결산)은 오후 2시에 나가므로 파이프라인과 시각이
      # 맞지 않는다. 별도 워크플로로 뺐다 — .github/workflows/telegram-broadcast.yml.
      #
      # 주말에는 이 워크플로가 아무것도 안 보낸다. 시장이 닫혀 있어 온도가 금요일 값
      # 그대로이고, 같은 숫자를 주말에 반복해 보내면 뮤트로 가는 지름길이다.
      # (C 는 토요일에 나간다 — 재료가 시장 숫자가 아니라 카더라 채널 메시지라 주말에도
      #  새 이야기가 쌓인다. telegram-broadcast.yml 의 '발송 요일 판정' 주석 참고.)
      #
      # 위 [1]~[4] 게이트는 두 스텝에 똑같이 걸린다. --ignore-staleness 는 **절대**
      # 여기 넣지 않는다 — 그걸 켜면 낡은 값 차단이 통째로 사라진다.
      #
      # [5] 완료 후 5분 — `sleep 300`
      #   요청받은 사항이다. 발송 스텝이 파이프라인 **안**에 있어서 엄밀히는 '완료 직전'이지만,
      #   여기 오기까지 자료 수집·점수 계산·카더라 집계가 전부 끝나 있고 뒤에 남은 건
      #   결과 집계와 알림뿐이다. 즉 실질적으로 '완료 후'가 맞다. 이 저장소는 public 이라
      #   Actions 분이 무료여서 러너를 5분 재우는 비용은 없다.
      - name: (텔레그램) A 어제 브리핑 발송 (평일 아침)
        id: telegram_morning
        continue-on-error: true
        if: >-
          steps.check_freshness.outcome == 'success'
          && steps.calculate_score.outcome == 'success'
          && github.run_attempt == '1'
          && steps.broadcast_when.outputs.weekday == 'true'
          && github.event.schedule == '0 0 * * *'
        run: |
          sleep 300   # 파이프라인 완료 후 5분(위 [5] 참고)
          python data-pipeline/scripts/send_telegram_broadcast.py --send --format morning

      - name: (텔레그램) B 마감 리포트 발송 (평일 저녁)
        id: telegram_broadcast
        continue-on-error: true
        if: >-
          steps.check_freshness.outcome == 'success'
          && steps.calculate_score.outcome == 'success'
          && github.run_attempt == '1'
          && (
            (github.event.schedule == '30 8 * * *' && steps.broadcast_when.outputs.weekday == 'true')
            || github.event.inputs.send_telegram == 'true'
          )
        run: |
          sleep 300   # 파이프라인 완료 후 5분(위 [5] 참고)
          python data-pipeline/scripts/send_telegram_broadcast.py --send --format evening



      - name: Summarize results
        if: always()
        run: |
          names=("fetch_kospi_high_gap.py" "fetch_buffett_index.py" "fetch_consumer_sentiment.py" "fetch_turnover_concentration.py" "fetch_naver_trend.py" "fetch_naver_luxury_car_trend.py" "fetch_naver_lifestyle_trend.py" "fetch_dcinside_stock.py" "fetch_kospi_volume.py" "fetch_vkospi.py" "fetch_put_call_ratio.py" "fetch_news_sentiment.py" "fetch_gold_ratio.py" "fetch_kosdaq_ratio.py" "fetch_usdkrw_volatility.py" "fetch_leverage_etf_volume.py" "fetch_bestseller_ratio.py" "fetch_youtube_finance_search.py" "fetch_asia_relative_strength.py" "fetch_upbit_speculation.py" "fetch_github_trading_repos.py" "fetch_brokerage_app_rank.py" "fetch_foreign_sell_at_high.py" "fetch_limit_up_breadth.py" "fetch_market_actions.py" "calculate_score.py" "check_freshness.py" "broadcast(A아침)" "broadcast(B마감)")
          outcomes=("${{ steps.kospi_high_gap.outcome }}" "${{ steps.buffett_index.outcome }}" "${{ steps.consumer_sentiment.outcome }}" "${{ steps.turnover_concentration.outcome }}" "${{ steps.naver_trend.outcome }}" "${{ steps.naver_luxury_car_trend.outcome }}" "${{ steps.naver_lifestyle_trend.outcome }}" "${{ steps.dcinside.outcome }}" "${{ steps.kospi_volume.outcome }}" "${{ steps.vkospi.outcome }}" "${{ steps.put_call_ratio.outcome }}" "${{ steps.news_sentiment.outcome }}" "${{ steps.gold_ratio.outcome }}" "${{ steps.kosdaq_ratio.outcome }}" "${{ steps.usdkrw_volatility.outcome }}" "${{ steps.leverage_etf.outcome }}" "${{ steps.bestseller_ratio.outcome }}" "${{ steps.youtube_finance_search.outcome }}" "${{ steps.asia_relative_strength.outcome }}" "${{ steps.upbit_speculation.outcome }}" "${{ steps.github_trading_repos.outcome }}" "${{ steps.brokerage_app_rank.outcome }}" "${{ steps.foreign_sell_at_high.outcome }}" "${{ steps.limit_up_breadth.outcome }}" "${{ steps.market_actions.outcome }}" "${{ steps.calculate_score.outcome }}" "${{ steps.check_freshness.outcome }}" "${{ steps.telegram_morning.outcome }}" "${{ steps.telegram_broadcast.outcome }}")

          {
            echo "## Daily update summary"
            echo "| Script | Result |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          failed=0
          failed_list=""
          for i in "${!names[@]}"; do
            script="${names[$i]}"
            outcome="${outcomes[$i]}"
            echo "$script: $outcome"
            case "$outcome" in
              success)
                echo "| $script | success |" >> "$GITHUB_STEP_SUMMARY"
                ;;
              skipped)
                # 'skipped'는 실패가 아니다. 위 스텝들 중 조건이 붙은 건 채널 발송
                # 하나뿐이고, 그건 아침 실행·재실행에서 **일부러** 건너뛴다(그 스텝의
                # 주석 참고). 이걸 실패로 세면 매일 아침 알림 이슈가 열린다.
                echo "| $script | skipped (예정된 건너뜀) |" >> "$GITHUB_STEP_SUMMARY"
                ;;
              *)
                echo "| $script | $outcome |" >> "$GITHUB_STEP_SUMMARY"
                failed=1
                failed_list="${failed_list:+$failed_list, }$script"
                ;;
            esac
          done

          if [ "$failed" = "1" ]; then
            # 실패한 스크립트 목록을 다음(알림) 스텝에서 쓸 수 있게 넘긴다.
            echo "FAILED_SCRIPTS=$failed_list" >> "$GITHUB_ENV"
            echo "One or more scripts failed. Check the step logs above for details."
            exit 1
          fi

      # 감지 레이어: 실행이 실패하면 알림용 GitHub 이슈를 열거나(없으면) 코멘트를
      # 추가한다. 별도 외부 설정 없이 기본 GITHUB_TOKEN만 쓴다. 같은 제목의 열린
      # 이슈가 있으면 새로 만들지 않고 코멘트만 달아 스팸을 막는다.
      - name: Alert on failure (open/update GitHub issue)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          failed="${FAILED_SCRIPTS:-요약 탭에서 확인}"
          title="⚠️ 데일리 파이프라인 실패"
          note=$(printf '데일리 업데이트 실행이 실패했습니다.\n\n- 시각(UTC): %s\n- 실패 스텝: %s\n- 로그/요약: %s\n\n다음 예약 실행(하루 2회)이 성공하면 데이터는 자동으로 만회됩니다. 계속 실패하면 확인이 필요합니다.' \
            "$(date -u '+%Y-%m-%d %H:%M')" "$failed" "$run_url")
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$note"
            echo "기존 알림 이슈 #$existing 에 코멘트 추가"
          else
            gh issue create --title "$title" --body "$note"
            echo "새 알림 이슈 생성"
          fi

      # ── 카더라(텔레그램) 전용 집계·알림 ──────────────────────────────────
      # 위 Summarize results 에 텔레그램 스텝을 넣지 않는 분리는 그대로 둔다. LLM 분류·
      # 집계·문장 생성은 하나 실패해도 다음 실행이 만회하는 단계들이라, 지표 알림에
      # 섞으면 알림이 자주 울려 결국 아무도 안 보게 된다.
      #
      # 그런데 그 분리 때문에 **고장이 조용했다.** 2026-07-28 01:28 UTC 실행(30320356222)은
      # FloodWait 으로 sync 가 resolve 를 0건 성공했고, peer 캐시가 0개라 fetch 가 317개를
      # 전부 건너뛰어 그날 메시지 수집이 0건이었는데, 잡은 success 로 끝나고 이슈도 안
      # 열렸다. 복구는 사람이 알아채고 손으로 돌려서야 됐다.
      #
      # 그래서 '스텝이 실패했나'가 아니라 **재료가 들어왔나**를 잰다. fetch_telegram.py 가
      # 수집 가능한 채널 0개 · 총 0건이면 exit 1 로 끝나므로(그 스크립트 main() 끝 주석),
      # 여기서는 그 결과만 보면 된다.
      #
      # 대상을 sync·fetch 둘로 좁힌 이유: 이 둘만 "그날치가 영영 빈다"를 뜻한다.
      # sync 가 죽으면 구독자 스냅샷이 그날 없이 지나가고(시계열이라 백필 불가),
      # fetch 가 죽으면 그날 메시지가 통째로 빈다. 나머지 스텝은 다음 실행이 만회한다.
      # 여기에 스텝을 더 넣고 싶어지면 그 기준을 먼저 통과시킬 것.
      - name: Summarize 카더라 collection (텔레그램 수집 전용)
        id: telegram_health
        if: always()
        run: |
          names=("sync_telegram_channels.py" "fetch_telegram.py")
          outcomes=("${{ steps.telegram_sync.outcome }}" "${{ steps.telegram_fetch.outcome }}")

          {
            echo "## 카더라 수집"
            echo "| Script | Result |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          failed=0
          failed_list=""
          for i in "${!names[@]}"; do
            script="${names[$i]}"
            outcome="${outcomes[$i]}"
            echo "$script: $outcome"
            echo "| $script | $outcome |" >> "$GITHUB_STEP_SUMMARY"
            # 여기 두 스텝은 조건이 없어 늘 돈다. 'skipped'는 앞 스텝이 잡을 멈춘
            # 경우뿐인데, 그때도 그날 수집은 없었던 것이라 실패로 센다.
            [ "$outcome" = "success" ] || { failed=1; failed_list="${failed_list:+$failed_list, }$script"; }
          done

          # 조건식(if:)에 쓸 참/거짓만 output 으로 넘기고, 목록은 위 Alert on failure 와
          # 같게 env 로 넘긴다 — 표현식을 셸 안에 그대로 펼치지 않으려는 것.
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
          echo "TELEGRAM_FAILED_SCRIPTS=$failed_list" >> "$GITHUB_ENV"

      # 지표 알림과 제목이 달라 이슈가 섞이지 않는다(각자 자기 제목으로 열리고 코멘트가 쌓인다).
      # 마지막에 exit 1 로 잡을 실패시킨다 — 수집이 멈춘 날이 초록으로 끝나면 이 감시는
      # 있으나 마나이기 때문이다. 발송 스텝은 이 앞에서 이미 끝나므로 영향받지 않는다.
      # !cancelled() 는 앞 스텝이 실패해도(=Summarize results 가 exit 1 한 날에도) 돌지만
      # 사람이 실행을 취소한 날에는 안 돈다. always() 로 두면 취소할 때마다 이슈가 열린다.
      - name: Alert on 카더라 failure (open/update GitHub issue)
        if: ${{ !cancelled() && steps.telegram_health.outputs.failed == '1' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          failed="${TELEGRAM_FAILED_SCRIPTS:-요약 탭에서 확인}"
          title="⚠️ 카더라(텔레그램) 수집 중단"
          note=$(printf '카더라 수집 스텝이 실패했습니다. 그날 메시지·구독자 스냅샷이 비어 있을 수 있습니다.\n\n- 시각(UTC): %s\n- 실패 스텝: %s\n- 로그/요약: %s\n\n먼저 볼 것: sync 로그의 "peer 캐시 보유 N/M개" 와 FloodWait 줄. FloodWait 이면 만료 뒤 다음 예약 실행이 캐시를 이어서 채웁니다(한 실행 최대 100개).' \
            "$(date -u '+%Y-%m-%d %H:%M')" "$failed" "$run_url")
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$note"
            echo "기존 알림 이슈 #$existing 에 코멘트 추가"
          else
            gh issue create --title "$title" --body "$note"
            echo "새 알림 이슈 생성"
          fi
          exit 1

      # ── 부분 수집(커버리지) 전용 알림 ────────────────────────────────────
      # 위 알림과 **합치지 않았다.** 제목이 곧 진단이라, "수집 중단" 하나로 묶으면
      # 며칠째 200/317 만 걷히는 날에도 '멈췄다'고 말하게 된다. 둘은 대응도 다르다 —
      # 저쪽은 그날 재료가 통째로 빈 것이고, 이쪽은 재료가 들어오긴 하는데 3분의 1이
      # 계속 빠지는 것이다. 제목이 다르면 이슈도 따로 열리고 따로 닫힌다.
      #
      # 위 telegram_health 배열에 스텝을 더하는 쪽도 생각했지만, 그 배열은 "그날치가
      # 영영 빈다"를 뜻하는 스텝만 담기로 기준이 서 있다(바로 위 주석). 커버리지는
      # 그 기준을 통과하지 못한다 — 빠진 채널은 다음 실행이 캐시를 채우면 7일 창 안에서
      # 백필로 따라온다.
      - name: Alert on 카더라 커버리지 저하 (open/update GitHub issue)
        if: ${{ !cancelled() && steps.telegram_coverage.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          title="⚠️ 카더라(텔레그램) 수집 커버리지 저하"
          note=$(printf '수집은 되는데 **며칠째 채널 일부만** 걷히고 있습니다. 화면의 언급 수·채널 수·점유율이 전부 그 일부만의 것입니다.\n\n- 시각(UTC): %s\n- 로그/요약: %s\n\n먼저 볼 것: 위 스텝 로그의 일별 커버리지 표와 "peer 캐시 N/M개" 줄, 그리고 telegram_flood_wait 표의 wait_until. 만료 뒤 실행이 캐시를 이어서 채우면(한 실행 최대 100개) 이 알림은 저절로 닫힙니다.\n\n⚠️ MAX_RESOLVES_PER_RUN 을 올리거나 --force-resolve 를 예약 실행에 넣지 마세요 — 그게 애초에 긴 FloodWait 을 만든 경위입니다(마이그레이션 021·022 주석).' \
            "$(date -u '+%Y-%m-%d %H:%M')" "$run_url")
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$note"
            echo "기존 알림 이슈 #$existing 에 코멘트 추가"
          else
            gh issue create --title "$title" --body "$note"
            echo "새 알림 이슈 생성"
          fi
          exit 1

      # ── KRX 공표 대기 게이트 ─────────────────────────────────────────────
      # **KRX Open API 는 전 영업일 자료를 08:00 KST 정각에 올린다**(2026-08-14 실측:
      # 07:54:52 엔 7개 서비스 전부 0행, 08:00:00 에 전부 채워짐. 5분 간격 30회 폴링).
      # 그 전에 지표를 받으면 어제치가 아니라 그제치가 저장돼 지수가 하루 밀린다.
      #
      # 큐 지연으로 실행 시각을 맞추는 대신 여기서 못 박는다. 지연이 61분이든 140분이든
      # 이 줄을 지나는 시각은 늘 08:00 이후다. (아침 실행이 08:00 뒤에 시작하면 즉시
      # 통과하므로 평소엔 아무 일도 하지 않는다 — 지연이 짧아진 날을 위한 안전장치다.)
      #
      # 오후 실행은 이미 한참 뒤라 그냥 통과한다.
      # ⚠️ **continue-on-error 가 붙어 있는 이유.** 이 스텝이 실패하면 뒤따르는 지표 스텝은
      #    (조건이 없으므로) 통째로 **건너뛰어진다** — 각자 continue-on-error 를 달고 있어도
      #    그건 자기 실패를 감쌀 뿐 앞 스텝의 실패는 못 막는다. 게이트 하나가 지표 28개를
      #    데려가는 셈이라, 게이트가 깨지면 **기다리지 않고 그냥 진행**하는 편이 낫다.
      #    (그 경우 최악이 '그제 자료로 하루 밀림'인데, 다음 실행이 만회한다.)
      # ⚠️ cancelled() 를 뺀 이유: 잡을 취소했는데 여기서 한 시간을 자고 있으면 안 된다.
      - name: KRX 공표(08:00 KST) 대기
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          # `date -d 'today 08:00'` 대신 날짜를 명시적으로 넣는다 — 러너(GNU date)와 손으로
          # 돌리는 맥(BSD date)의 파싱이 갈리는 자리라, 애매한 표현을 쓰지 않는다.
          today=$(TZ=Asia/Seoul date +%Y-%m-%d)
          target=$(TZ=Asia/Seoul date -d "$today 08:00" +%s 2>/dev/null || TZ=Asia/Seoul date -j -f '%Y-%m-%d %H:%M' "$today 08:00" +%s)
          now=$(date +%s)
          wait=$(( target - now ))
          if [ "$wait" -gt 0 ]; then
            echo "KRX 공표까지 $((wait / 60))분 대기합니다 (현재 $(TZ=Asia/Seoul date '+%H:%M') KST)"
            sleep "$wait"
          else
            echo "이미 08:00 KST 를 지났습니다 (현재 $(TZ=Asia/Seoul date '+%H:%M') KST) — 대기 없음"
          fi

      # ── 지표 파이프라인 ─────────────────────────────────────────────────
      # 위 카더라보다 **뒤에** 둔다. 카더라는 KRX 와 무관해 아무 때나 돌 수 있고,
      # 지표는 08:00 을 기다려야 한다. 순서를 이렇게 두면 기다리는 동안 카더라가
      # 끝나 있어서, 화면의 카더라 면이 지표보다 한 시간쯤 먼저 새로워진다.


      # ⚠️ 매일 돌려도 된다. 재무부가 **앞 달을 수정**하므로 전 기간을 통째로 다시
      #    쓰는 게 맞고(실측: 2026-05 잔고가 다음 발표에서 +961 바뀌었다), 9MB 내려받아
      #    3,500행 upsert 라 비용이 없다.

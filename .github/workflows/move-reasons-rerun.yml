# 지난 날의 '급등 종목' 까닭을 다시 만든다. 손으로만 돈다.
#
# ## 왜 따로 있나
#
# 까닭은 LLM 이 쓴다. 구독 경로(claude -p)는 러너에만 열려 있고, 로컬에서 생성기를 돌리면
# 토큰이 없어 조용히 API 로 청구된다(common/llm_client.py 머리말). 그렇다고 daily-update.yml 을
# 손으로 돌리면 지표 수집 전부가 한 번 더 돈다. 그래서 생성기 하나만 도는 길을 따로 둔다.
#
# 처음 쓴 곳은 2026-09-24~26 추석이다. 생성기가 그날 글 수로 아침 실행을 짐작하던 때라 연휴
# 저녁도 걸려 미장 판 사흘이 빠졌다(generate_move_reasons.py 머리 주석).
#
# ⚠️ 그날 판을 **덮어쓴다**(upsert + 후보에서 빠진 행 삭제). 멀쩡한 날을 넣으면 그날 문장이
#    새로 써진다.
# ⚠️ 국장은 주말·장이 안 열린 날을 생성기가 스스로 건너뛴다. 연휴를 채울 땐 대개 `us` 면 된다.
name: 급등 종목 까닭 다시 만들기 (수동)

on:
  workflow_dispatch:
    inputs:
      dates:
        description: "다시 만들 날짜(KST, YYYY-MM-DD). 여럿이면 공백으로 띄운다"
        required: true
        type: string
      market:
        description: "어느 쪽 (us=미장만 · kr=국장만 · both=둘 다)"
        type: choice
        default: us
        options: [us, kr, both]

jobs:
  rerun:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read   # 화면을 비우기 전에 데일리 파이프라인이 도는지 본다(scripts/pipeline-busy.sh)
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      # 구독 경로가 먼저, 실패하면 API(daily-update.yml 과 같다). 로그의 `[LLM]` 줄로 어느 쪽이었는지 본다.
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r data-pipeline/requirements.txt

      - name: Install Claude Code CLI (LLM 구독 경로)
        continue-on-error: true
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/claude" --version

      # 날짜는 사람이 적는 글자라 먼저 전부 꼴을 본다. 하나라도 틀리면 아무것도 안 만든다.
      - name: 날짜마다 다시 만들기
        env:
          DATES: ${{ github.event.inputs.dates }}
          MARKET: ${{ github.event.inputs.market }}
        run: |
          set -f
          case "$MARKET" in
            us) flag=--us-only ;;
            kr) flag=--kr-only ;;
            *) flag= ;;
          esac
          for d in $DATES; do
            if ! [[ "$d" =~ ^20[0-9]{2}-[01][0-9]-[0-3][0-9]$ ]]; then
              echo "::error::날짜 꼴이 아닙니다: $d"
              exit 1
            fi
          done
          for d in $DATES; do
            echo "::group::$d"
            python data-pipeline/scripts/generate_move_reasons.py --date "$d" $flag
            echo "::endgroup::"
          done

      # 데일리 파이프라인이 아직 화면을 다 비우기 전이면 여기서는 비우지 않는다(scripts/pipeline-busy.sh · 2026-10-17).
      # 그 사이 페이지를 비우면 반쯤 바뀐 DB 로 그려져 한 페이지 안이 따로 바뀐다. 그 실행의 finalize 가 이 값까지 같이 비운다.
      - name: 데일리 파이프라인이 화면을 비우는 중인지 보기
        id: busy
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if bash scripts/pipeline-busy.sh; then echo "busy=true" >> "$GITHUB_OUTPUT"; else echo "busy=false" >> "$GITHUB_OUTPUT"; fi

      # 새 등락 이유가 보이게 그 표를 읽는 화면을 비운다(2026-10-17 — 예전엔 비우기가 없어 화면 캐시가 끝나는 한 시간 뒤에
      # 보였다. 이제 조회 사본이 시간으로 만료되지 않아 비우지 않으면 다음 파이프라인까지 안 보인다). 국장 · 미장 카더라 ·
      # 테마 상세 · 종목 화면이 telegram_stock_move_reason · telegram_us_stock_move_reason 을 읽는다.
      # ⚠️ 대괄호는 셸 글롭이라 따옴표를 벗기지 말 것.
      - name: 등락 이유를 읽는 화면 비우고 데우기
        if: ${{ !cancelled() && steps.busy.outputs.busy != 'true' }}
        continue-on-error: true
        env:
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: bash scripts/revalidate.sh /kadera /kadera/us '/theme/[theme]' '/theme/us/[theme]' '/stock/[code]'

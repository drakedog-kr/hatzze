# 지난 날의 '급등 종목' 까닭을 다시 만든다. 손으로만 돈다.
#
# ## 왜 따로 있나
#
# 까닭은 LLM 이 쓴다. 구독 경로(claude -p)는 러너에만 열려 있고, 로컬에서 생성기를 돌리면
# 토큰이 없어 조용히 API 로 청구된다(common/llm_client.py 머리말). 그렇다고 daily-update.yml 을
# 손으로 돌리면 지표 수집 전부가 한 번 더 돈다. 그래서 생성기 하나만 도는 길을 따로 둔다.
#
# 처음 쓴 곳은 2026-09-24~26 추석이다. 생성기가 그날 글 수로 아침 실행을 짐작하던 때라 연휴
# 저녁도 걸려 미장 판 사흘이 빠졌다(generate_move_reasons.py 머리 주석).
#
# ⚠️ 그날 판을 **덮어쓴다**(upsert + 후보에서 빠진 행 삭제). 멀쩡한 날을 넣으면 그날 문장이
#    새로 써진다.
# ⚠️ 국장은 주말·장이 안 열린 날을 생성기가 스스로 건너뛴다. 연휴를 채울 땐 대개 `us` 면 된다.
name: 급등 종목 까닭 다시 만들기 (수동)

on:
  workflow_dispatch:
    inputs:
      dates:
        description: "다시 만들 날짜(KST, YYYY-MM-DD). 여럿이면 공백으로 띄운다"
        required: true
        type: string
      market:
        description: "어느 쪽 (us=미장만 · kr=국장만 · both=둘 다)"
        type: choice
        default: us
        options: [us, kr, both]

jobs:
  rerun:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      # 구독 경로가 먼저, 실패하면 API(daily-update.yml 과 같다). 로그의 `[LLM]` 줄로 어느 쪽이었는지 본다.
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r data-pipeline/requirements.txt

      - name: Install Claude Code CLI (LLM 구독 경로)
        continue-on-error: true
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/claude" --version

      # 날짜는 사람이 적는 글자라 먼저 전부 꼴을 본다. 하나라도 틀리면 아무것도 안 만든다.
      - name: 날짜마다 다시 만들기
        env:
          DATES: ${{ github.event.inputs.dates }}
          MARKET: ${{ github.event.inputs.market }}
        run: |
          set -f
          case "$MARKET" in
            us) flag=--us-only ;;
            kr) flag=--kr-only ;;
            *) flag= ;;
          esac
          for d in $DATES; do
            if ! [[ "$d" =~ ^20[0-9]{2}-[01][0-9]-[0-3][0-9]$ ]]; then
              echo "::error::날짜 꼴이 아닙니다: $d"
              exit 1
            fi
          done
          for d in $DATES; do
            echo "::group::$d"
            python data-pipeline/scripts/generate_move_reasons.py --date "$d" $flag
            echo "::endgroup::"
          done

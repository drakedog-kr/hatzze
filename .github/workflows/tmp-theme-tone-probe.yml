# ⚠️ 임시 측정 — 머지하지 않는다. 테마 톤이 그 테마 주가를 따라 움직이나(읽기 전용, DB 에 안 쓴다).
# 이 브랜치에 푸시할 때만 돈다. 결과를 읽고 나면 이 파일과 스크립트를 지운다.
name: 임시 측정 — 테마 톤과 주가

on:
  push:
    branches: [claude/happy-bardeen-t17504]
    paths:
      - ".github/workflows/tmp-theme-tone-probe.yml"
      - "data-pipeline/scripts/tmp_theme_tone_probe.py"

permissions:
  contents: read
  actions: read # 지난 실행의 재료 아티팩트를 받는다

env:
  # 재료(DB 에서 읽은 것·주가)를 남긴 지난 실행. 비우면 처음부터 읽는다(DB 15분 남짓).
  PROBE_CACHE_RUN: ""

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      # 측정에 드는 것만 — 전체 requirements 는 형태소 분석기 빌드로 10분이 걸린다.
      - run: pip install "requests>=2.32,<3" "python-dotenv>=1.0,<2" "supabase>=2.31,<3" "pandas>=2.2,<3" "yfinance>=1.2,<2"
      - name: 지난 재료 받기
        if: env.PROBE_CACHE_RUN != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: probe-cache
          path: data-pipeline/probe_cache
          run-id: ${{ env.PROBE_CACHE_RUN }}
          github-token: ${{ github.token }}
      - name: 측정
        working-directory: data-pipeline
        run: python scripts/tmp_theme_tone_probe.py
      - name: 재료 남기기
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-cache
          path: data-pipeline/probe_cache
          retention-days: 3
          if-no-files-found: ignore

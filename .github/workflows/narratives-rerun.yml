# 카더라 '많이 언급된 종목'의 흐름 요약(종목 요약) · 테마 요약(테마 흐름 '요즘 도는 얘기' · 급부상 이유)만 다시 만든다. 손으로만 돈다.
# what: narratives(흐름 요약 · 기본) · themes(테마 요약) · both. 테마 요약은 2026-10-05 저녁 첫 문장 55자 · 급부상 이유 42~58자로
# 줄인 PR 을 머지한 직후 그날 것을 바로 고치려고 더했다.
#
# ## 왜 따로 있나
#
# 흐름 요약은 LLM 이 쓴다. 구독 경로(claude -p)는 러너에만 열려 있고, 로컬에서 생성기를 돌리면 토큰이 없어 조용히 API 로
# 청구된다(common/llm_client.py 머리말). 그렇다고 daily-update.yml 을 손으로 돌리면 지표 수집 전부가 한 번 더 돈다(3시간).
# 그래서 생성기 둘(국장 · 미장)만 도는 길을 따로 둔다(surging-oneliners-rerun.yml · move-reasons-rerun.yml 과 같은 꼴).
#
# `--stocks-only` 라 총평('오늘의 요약')은 그대로 두고 종목 요약만 다시 쓴다. 처음 쓸 곳은 요약 길이를 95~105 → 62~72자로
# 줄인 PR(#651)을 머지한 직후다(2026-10-05 저녁 — 그날 저녁 실행이 쓴 긴 요약을 다음 아침까지 두지 않으려고).
#
# ⚠️ daily-update.yml 이 도는 동안엔 돌리지 말 것 — 같은 표를 같이 쓴다.
name: 흐름 요약 · 테마 요약 다시 만들기 (수동)

on:
  workflow_dispatch:
    inputs:
      market:
        description: "어느 쪽 (both=둘 다 · kr=국장만 · us=미장만)"
        type: choice
        default: both
        options: [both, kr, us]
      what:
        description: "무엇을 (narratives=흐름 요약 · themes=테마 요약 · both=둘 다)"
        type: choice
        default: narratives
        options: [narratives, themes, both]

jobs:
  rerun:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r data-pipeline/requirements.txt
      - name: Install Claude Code CLI (LLM 구독 경로)
        continue-on-error: true
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/claude" --version

      - name: (국장) 흐름 요약 다시 만들기
        if: ${{ github.event.inputs.market != 'us' && github.event.inputs.what != 'themes' }}
        run: python data-pipeline/scripts/generate_telegram_narratives.py --stocks-only

      - name: (미장) 흐름 요약 다시 만들기
        if: ${{ !cancelled() && github.event.inputs.market != 'kr' && github.event.inputs.what != 'themes' }}
        run: python data-pipeline/scripts/generate_us_telegram_narratives.py --stocks-only

      # 테마 요약은 26 · 16 테마를 다 다시 쓴다(급부상 이유 포함). 하루치 행을 그대로 덮는다.
      - name: (국장) 테마 요약 다시 만들기
        if: ${{ !cancelled() && github.event.inputs.market != 'us' && github.event.inputs.what != 'narratives' }}
        run: python data-pipeline/scripts/generate_theme_briefs.py

      - name: (미장) 테마 요약 다시 만들기
        if: ${{ !cancelled() && github.event.inputs.market != 'kr' && github.event.inputs.what != 'narratives' }}
        run: python data-pipeline/scripts/generate_us_theme_briefs.py

      # 새 문장이 바로 보이게 화면을 비우고 데운다(daily-update.yml 의 같은 자리와 같다).
      - name: 카더라 · 종목 화면 비우고 데우기
        if: ${{ !cancelled() && github.event.inputs.what != 'themes' }}
        continue-on-error: true
        env:
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: bash scripts/revalidate.sh /kadera /kadera/us '/stock/[code]'

      - name: 테마 화면 비우고 데우기
        if: ${{ !cancelled() && github.event.inputs.what != 'narratives' }}
        continue-on-error: true
        env:
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: bash scripts/revalidate.sh /theme /theme/us '/theme/[theme]' '/theme/us/[theme]'
